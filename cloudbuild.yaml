substitutions:
  _DOCKERFILE: services/chat-api/Dockerfile
  _IMAGE_NAME: omniagent-chat
  _IMAGE_TAG: dev
  _IMAGE_REPOSITORY: ""
  _OMNIAGENT_GOOGLE_CLIENT_ID: ""

steps:
  - id: require-omniagent-image-repository
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_IMAGE_REPOSITORY}" || { echo "missing _IMAGE_REPOSITORY for omniAgent"; exit 2; }
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=${_DOCKERFILE}
      - --build-arg=OMNIAGENT_GOOGLE_CLIENT_ID=${_OMNIAGENT_GOOGLE_CLIENT_ID}
      - --tag=${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}"]

images:
  - ${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
