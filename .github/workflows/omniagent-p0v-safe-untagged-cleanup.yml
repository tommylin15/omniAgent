# Safe, one-shot, untagged-only retention. NO tag removal, no traffic mutation.
# Requires exact main commit marker after owner-reviewed inventory.
name: omniAgent P0-V safe untagged revision cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-p0v-safe-untagged-cleanup.yml'
      - 'docs/shared-gemini-vertical-slice.md'
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-p0v-retention-isolated
  cancel-in-progress: false
jobs:
  untagged-only:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[p0v-untagged-cleanup-once]') &&
      !contains(github.event.head_commit.message, '[release-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact latest main, marker, and safety tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git log -1 --format=%B | grep -Fq '[p0v-untagged-cleanup-once]'
          python3 -m unittest discover -s tests -p 'test_p0v_safe_revision_cleanup.py' -v
          python3 -m unittest discover -s tests -p 'test_cloudrun_revision_retention.py' -v
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fresh preflight of all three and verify independent Ready Secret-backed rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retention-receipts
          for svc in omniagent-agent-gateway omniagent-chat omniagent-shared-codex; do
            python3 scripts/p0v_safe_revision_cleanup.py --mode verify --service "$svc" \
              --receipt "retention-receipts/$svc-before.json"
          done
          python3 - <<'PY'
          import json,pathlib
          expected={"omniagent-chat":(25,5),"omniagent-agent-gateway":(24,3),
                    "omniagent-shared-codex":(17,0)}
          for svc,(count,deletable) in expected.items():
              r=json.loads((pathlib.Path("retention-receipts")/(svc+"-before.json")).read_text())
              if r["revisions_before"]!=count or len(r["proposed_delete"])!=deletable:
                  raise SystemExit("BLOCKED: approved exact inventory changed for "+svc)
              if deletable and not r.get("verified_fallback"):
                  raise SystemExit("BLOCKED: fallback verification missing for "+svc)
          print("exact_predelete_inventory_and_rollback=PASS")
          PY
      - name: Delete ONLY currently untagged unprotected revisions with per-delete readback
        shell: bash
        run: |
          set -euo pipefail
          for svc in omniagent-agent-gateway omniagent-chat omniagent-shared-codex; do
            python3 scripts/p0v_safe_revision_cleanup.py --mode apply --service "$svc" \
              --receipt "retention-receipts/$svc-after.json"
          done
          python3 - <<'PY'
          import json,pathlib,os
          target={"omniagent-chat":20,"omniagent-agent-gateway":21,
                  "omniagent-shared-codex":17}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### Postrelease P0-V untagged-only deletion acceptance\n\n")
              for svc,count in target.items():
                  r=json.loads((pathlib.Path("retention-receipts")/(svc+"-after.json")).read_text())
                  if r["status"] not in ("PASS","PASS_NO_DELETION_NEEDED") or len(r["retained"])!=count:
                      raise SystemExit("BLOCKED: partial cleanup receipt "+svc)
                  if r["tags_retired"] or len(r["deleted"])!=r["revisions_before"]-count:
                      raise SystemExit("BLOCKED: unsafe or incomplete deletion receipt "+svc)
                  out.write(f'- {svc}: {r["revisions_before"]} → {count}, deleted {len(r["deleted"])}, tags retired ZERO\n')
              out.write("\nAll original existing tags, active revisions and verified fallbacks retained. No IAM, traffic, provider inference or database operation. ≤10 per service remains OPEN.\n")
          PY
      - name: Preserve redacted receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0v-untagged-cleanup-${{ github.run_id }}
          path: retention-receipts/*.json
          if-no-files-found: warn
          retention-days: 90
