# Current GHCR pipeline only: inspect live Cloud Run Secret VERSION references.
# Read-only. Never access Secret payloads or print environment literal values.
name: omniAgent GHCR secret reference diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-secret-reference-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect three live services and referenced Secret version metadata ONLY
        shell: bash
        env:
          PROJECT: gen-lang-client-0593591102
          REGION: us-central1
        run: |
          set -euo pipefail
          umask 077
          for service in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$service" --project="$PROJECT" \
              --region="$REGION" --format=json > "$RUNNER_TEMP/$service.json"
          done
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          project=os.environ["PROJECT"]
          services=("omniagent-chat","omniagent-agent-gateway","omniagent-shared-codex")
          version_states={}
          errors=[]
          for service in services:
              obj=json.loads((root/(service+".json")).read_text())
              status=obj.get("status") or {}
              routes=status.get("traffic") or []
              serving={r.get("revisionName"):r.get("percent",0) for r in routes if r.get("percent",0)>0}
              latest=status.get("latestReadyRevisionName")
              print(json.dumps({"service":service,"latest_ready":latest,"serving":serving},sort_keys=True))
              if not serving or sum(serving.values())!=100:
                  errors.append("FORMAL_TRAFFIC_UNVERIFIED:"+service)
              spec=(((obj.get("spec") or {}).get("template") or {}).get("spec") or {})
              refs=[]
              for container in spec.get("containers") or []:
                  for env in container.get("env") or []:
                      secret=((env.get("valueFrom") or {}).get("secretKeyRef") or {})
                      if secret:
                          refs.append((str(secret.get("name","")),str(secret.get("key",""))))
              if not refs:
                  print("secret_refs="+service+":NONE_OBSERVED")
              for name,version in sorted(set(refs)):
                  # Fail closed on ambiguous references; never invoke arbitrary CLI arguments.
                  if not re.fullmatch(r"[a-zA-Z0-9_-]{1,255}",name) or not re.fullmatch(r"(?:[0-9]+|latest)",version):
                      print("secret_metadata="+service+":INVALID_REFERENCE")
                      errors.append("INVALID_REFERENCE:"+service)
                      continue
                  k=(name,version)
                  if k not in version_states:
                      cp=subprocess.run(["gcloud","secrets","versions","describe",version,"--secret="+name,
                          "--project="+project,"--format=value(state)"],capture_output=True,text=True,timeout=25)
                      if cp.returncode==0:
                          val=cp.stdout.strip().upper()
                          version_states[k]=val if val in ("ENABLED","DISABLED","DESTROYED") else "UNKNOWN_STATE"
                      else:
                          # No raw stderr or Secret payload is ever logged.
                          version_states[k]="NOT_READABLE_OR_NOT_FOUND"
                  state=version_states[k]
                  print(json.dumps({"service":service,"secret":name,"version":version,"metadata_state":state},
                                   sort_keys=True))
                  if state!="ENABLED":
                      errors.append("SECRET_VERSION_NOT_VERIFIED_ENABLED:"+service)
          if errors:
              print("candidate_secret_preflight=BLOCKED")
              print("blocked_categories="+",".join(sorted(set(errors))))
              raise SystemExit(1)
          print("candidate_secret_metadata_preflight=PASS")
          print("secret_payload_or_application_compatibility=NOT_VERIFIED")
          print("formal_traffic_mutated=NO")
          PY
