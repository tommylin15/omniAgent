# Current GHCR pipeline only: inspect live Cloud Run Secret VERSION references.
# Read-only. Never access Secret payloads or print environment literal values.
name: omniAgent GHCR secret reference diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-secret-reference-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect three live services and referenced Secret version metadata ONLY
        shell: bash
        env:
          PROJECT: gen-lang-client-0593591102
          REGION: us-central1
        run: |
          set -euo pipefail
          umask 077
          for service in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$service" --project="$PROJECT" \
              --region="$REGION" --format=json > "$RUNNER_TEMP/$service.json"
          done
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          project=os.environ["PROJECT"]
          services=("omniagent-chat","omniagent-agent-gateway","omniagent-shared-codex")
          version_states={}
          errors=[]
          for service in services:
              obj=json.loads((root/(service+".json")).read_text())
              status=obj.get("status") or {}
              routes=status.get("traffic") or []
              serving={r.get("revisionName"):r.get("percent",0) for r in routes if r.get("percent",0)>0}
              latest=status.get("latestReadyRevisionName")
              print(json.dumps({"service":service,"latest_ready":latest,"serving":serving},sort_keys=True))
              if not serving or sum(serving.values())!=100:
                  errors.append("FORMAL_TRAFFIC_UNVERIFIED:"+service)
              spec=(((obj.get("spec") or {}).get("template") or {}).get("spec") or {})
              refs=[]
              for container in spec.get("containers") or []:
                  for env in container.get("env") or []:
                      secret=((env.get("valueFrom") or {}).get("secretKeyRef") or {})
                      if secret:
                          env_name=str(env.get("name",""))
                          if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,127}",env_name):
                              errors.append("INVALID_ENV_NAME:"+service)
                              continue
                          refs.append((str(secret.get("name","")),str(secret.get("key","")),env_name))
              if not refs:
                  print("secret_refs="+service+":NONE_OBSERVED")
              for name,version,env_name in sorted(set(refs)):
                  # Fail closed on ambiguous references; never invoke arbitrary CLI arguments.
                  if not re.fullmatch(r"[a-zA-Z0-9_-]{1,255}",name) or not re.fullmatch(r"(?:[0-9]+|latest)",version):
                      print("secret_metadata="+service+":INVALID_REFERENCE")
                      errors.append("INVALID_REFERENCE:"+service)
                      continue
                  k=(name,version)
                  if k not in version_states:
                      cp=subprocess.run(["gcloud","secrets","versions","describe",version,"--secret="+name,
                          "--project="+project,"--format=value(state)"],capture_output=True,text=True,timeout=25)
                      if cp.returncode==0:
                          val=cp.stdout.strip().upper()
                          version_states[k]=val if val in ("ENABLED","DISABLED","DESTROYED") else "UNKNOWN_STATE"
                      else:
                          # No raw stderr or Secret payload is ever logged.
                          version_states[k]="NOT_READABLE_OR_NOT_FOUND"
                  state=version_states[k]
                  print(json.dumps({"service":service,"env_name":env_name,"secret":name,"version":version,"metadata_state":state},
                                   sort_keys=True))
                  if state!="ENABLED":
                      errors.append("SECRET_VERSION_NOT_VERIFIED_ENABLED:"+service)
          # Authorized metadata-only inventory: no Secret payload reads or raw errors.
          try:
              cp=subprocess.run(["gcloud","secrets","versions","list",
                  "--secret=omniagent-bundle","--project="+project,
                  "--format=json(name,state)"],capture_output=True,text=True,timeout=25)
              if cp.returncode:
                  print("bundle_version_inventory=NOT_READABLE")
                  # Supplemental inventory only; per-version metadata read can be authorized without list.
              else:
                  versions=json.loads(cp.stdout)
                  for version in versions:
                      identifier=str(version.get("name","")).rsplit("/",1)[-1]
                      state=str(version.get("state","")).upper()
                      if re.fullmatch(r"[0-9]+",identifier) and state in ("ENABLED","DISABLED","DESTROYED"):
                          print(json.dumps({"bundle_version":identifier,"state":state},sort_keys=True))
                      else:
                          print("bundle_version_inventory=INVALID_METADATA")
                          # Supplemental enumeration is not required to validate active references.
                  if not versions:
                      print("bundle_version_inventory=EMPTY")
                      # Per-reference checks still control the preflight.
          except (OSError,subprocess.TimeoutExpired,ValueError):
              print("bundle_version_inventory=NOT_VERIFIED")
              # Per-reference checks still control the preflight.
          # Read-only failed-Revision route diagnostics. No environment literal values.
          gateway=json.loads((root/"omniagent-agent-gateway.json").read_text())
          gst=gateway.get("status") or {}
          print(json.dumps({"diagnostic":"gateway_revisions_and_traffic",
             "latest_created":gst.get("latestCreatedRevisionName"),
             "latest_ready":gst.get("latestReadyRevisionName"),
             "template_revision_name":((gateway.get("spec") or {}).get("template") or {}).get("metadata",{}).get("name"),
             "spec_traffic":[{"revision":x.get("revisionName"),"latest":x.get("latestRevision"),
                 "percent":x.get("percent"),"tag":x.get("tag")}
                 for x in (gateway.get("spec") or {}).get("traffic",[])],
             "status_traffic":[{"revision":x.get("revisionName"),"percent":x.get("percent"),
                 "tag":x.get("tag"),"url_present":bool(x.get("url"))}
                 for x in gst.get("traffic",[])]},sort_keys=True))
          for revision in dict.fromkeys(filter(None,(gst.get("latestCreatedRevisionName"),
                      gst.get("latestReadyRevisionName"),"omniagent-agent-gateway-00021-boq"))):
              if not re.fullmatch(r"omniagent-agent-gateway-[0-9]{5}-[a-z0-9]{3}",revision):
                  print("revision_diagnostic=INVALID_REVISION_NAME")
                  continue
              cp=subprocess.run(["gcloud","run","revisions","describe",revision,
                 "--project="+project,"--region="+os.environ["REGION"],"--format=json"],
                 capture_output=True,text=True,timeout=40)
              if cp.returncode!=0:
                  print(json.dumps({"revision":revision,"diagnostic":"NOT_READABLE"}))
                  continue
              rev=json.loads(cp.stdout)
              conditions=(rev.get("status") or {}).get("conditions") or []
              envrefs=[{"env":str(e.get("name","")),
                         "secret_name":str((((e.get("valueFrom") or {}).get("secretKeyRef")) or {}).get("name","")),
                         "secret_version":str((((e.get("valueFrom") or {}).get("secretKeyRef")) or {}).get("key",""))}
                       for c in ((rev.get("spec") or {}).get("containers") or [])
                       for e in (c.get("env") or []) if (e.get("valueFrom") or {}).get("secretKeyRef")]
              print(json.dumps({"revision":revision,
                  "conditions":[{"type":c.get("type"),"status":c.get("status"),"reason":c.get("reason")}
                     for c in conditions],
                  "env_secret_refs":envrefs,
                  "service_account_present":bool((rev.get("spec") or {}).get("serviceAccountName"))},
                  sort_keys=True))
          if errors:
              print("candidate_secret_preflight=BLOCKED")
              print("blocked_categories="+",".join(sorted(set(errors))))
              raise SystemExit(1)
          print("candidate_secret_metadata_preflight=PASS")
          print("secret_payload_or_application_compatibility=NOT_VERIFIED")
          print("formal_traffic_mutated=NO")
          PY
