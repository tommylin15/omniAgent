name: omniAgent shared PostgreSQL bootstrap execute

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-shared-postgres-bootstrap-execute.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  OMNIAGENT_GCP_WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  OMNIAGENT_GCP_CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
  OMNIAGENT_CHAT_DB_SECRET: omniagent-chat-db
  OMNIAGENT_POSTGRES_HOST_PORT: '5432'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.OMNIAGENT_GCP_WIF_PROVIDER }}
          service_account: ${{ env.OMNIAGENT_GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Bootstrap shared PostgreSQL DB boundary
        shell: bash
        run: |
          set -euo pipefail
          export OMNIAGENT_POSTGRES_HOST_VM="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          export OMNIAGENT_POSTGRES_HOST_ZONE='us-central1-a'
          export OMNIAGENT_POSTGRES_CONTAINER="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          bash infra/gcp/bootstrap-omniagent-postgres.sh

      - name: Read back non-secret DB contract
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp)"
          trap 'rm -f "$work"' EXIT
          gcloud secrets versions access latest \
            --secret="$OMNIAGENT_CHAT_DB_SECRET" \
            --project="$GCP_PROJECT_ID" >"$work"
          python3 - "$work" <<'PY'
          import sys
          from urllib.parse import urlparse
          u=urlparse(open(sys.argv[1],encoding="utf-8").read().strip())
          assert u.scheme in ("postgresql","postgres")
          assert u.username=="omniagent_chat_app"
          assert (u.path or "").lstrip("/")=="omniagent_chat"
          assert (u.port or 5432)==5432
          assert u.hostname
          print("db_secret=omniagent-chat-db")
          print("db_user="+u.username)
          print("db_port="+str(u.port or 5432))
          print("db_name="+(u.path or "").lstrip("/"))
          PY

# retry: noexec-tmp
