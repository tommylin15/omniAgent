# A successful exact-main GHCR publish creates ONLY zero-traffic candidates.
# Promotion, historical triggers and GCS/AR deletion are intentionally NOT automated
# without the real Chat/browser/owner/provider/Shared acceptance evidence.
name: omniAgent GHCR Cloud Run zero-traffic candidates
on:
  workflow_run:
    workflows: ['omniAgent GHCR image publish']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: omniagent-ghcr-cloudrun-candidates
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'tommylin15/omniAgent' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify current-main provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          echo "approved_head_sha=$RELEASE_SHA"
      - uses: docker/setup-buildx-action@v3
      - name: Verify all 3 images are anonymous-readable; pin immutable digests
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/image-receipts.tsv"
          for item in 'omniagent-chat omniagent-chat' 'omniagent-agent-gateway omniagent-agent-gateway' 'omniagent-shared-codex omniagent-shared-codex'; do
            read -r service image <<< "$item"
            ref="ghcr.io/tommylin15/$image:$RELEASE_SHA"
            if ! docker buildx imagetools inspect "$ref" > "$RUNNER_TEMP/manifest.txt" 2>/dev/null; then
              echo "::error::GHCR image is not anonymously readable; set this package Public: $image"
              exit 1
            fi
            digest="$(sed -n 's/^Digest:[[:space:]]*//p' "$RUNNER_TEMP/manifest.txt" | head -n 1)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Immutable GHCR digest absent"; exit 1; }
            printf '%s\t%s\n' "$service" "ghcr.io/tommylin15/$image@$digest" >> "$RUNNER_TEMP/image-receipts.tsv"
            echo "public_ghcr_digest_verified=$service $digest"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect existing services and freeze current traffic and runtime config
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r svc image; do
            gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/$svc-before.json"
            python3 - "$RUNNER_TEMP/$svc-before.json" "$svc" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          s=d.get("status",{})
          spec=d.get("spec",{}).get("template",{}).get("spec",{})
          if not s.get("latestReadyRevisionName") or not spec.get("serviceAccountName"):
              raise SystemExit("BLOCKED: existing runtime identity/readiness unavailable")
          allocation={r.get("revisionName"):r.get("percent",0) for r in s.get("traffic",[]) if r.get("percent",0)>0}
          if not allocation or sum(allocation.values())!=100:
              raise SystemExit("BLOCKED: current traffic not fully understood")
          print(json.dumps({"service":sys.argv[2],"serving_traffic":allocation,"runtime_sa_configured":True},sort_keys=True))
          PY
          done < "$RUNNER_TEMP/image-receipts.tsv"
      - name: Deploy immutable public GHCR candidates with NO traffic
        shell: bash
        run: |
          set -euo pipefail
          tag="ghcr-${RELEASE_SHA:0:12}"
          while IFS=$'\t' read -r svc image; do
            # A newer commit invalidates every remaining mutation.
            test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$RELEASE_SHA"
            gcloud run deploy "$svc" --project="$PROJECT" --region="$REGION" \
              --image="$image" --no-traffic --tag="$tag" --quiet > /dev/null
            gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/$svc-after.json"
            python3 - "$RUNNER_TEMP/$svc-before.json" "$RUNNER_TEMP/$svc-after.json" "$svc" "$image" <<'PY'
          import json,sys
          before,after=(json.load(open(p)) for p in sys.argv[1:3])
          def serving(d):
              return {r.get("revisionName"):r.get("percent",0)
                      for r in d.get("status",{}).get("traffic",[]) if r.get("percent",0)>0}
          if serving(before)!=serving(after):
              raise SystemExit("BLOCKED: active formal traffic changed; operator recovery required")
          def protected(d):
              t=d.get("spec",{}).get("template",{})
              s=t.get("spec",{})
              return (s.get("serviceAccountName"),s.get("vpcAccess"),
                [c.get("env") for c in s.get("containers",[])],
                d.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/ingress"))
          if protected(before)!=protected(after):
              raise SystemExit("BLOCKED: runtime identity/Secret/VPC/ingress changed")
          def protected_annotations(d):
              ann=d.get("spec",{}).get("template",{}).get("metadata",{}).get("annotations",{})
              return {k:v for k,v in ann.items() if any(w in k.lower() for w in ("vpc","network","ingress"))}
          if protected_annotations(before)!=protected_annotations(after):
              raise SystemExit("BLOCKED: private networking annotations changed")
          observed=(after.get("spec",{}).get("template",{}).get("spec",{}).get("containers") or [{}])[0].get("image")
          if observed!=sys.argv[4]:
              raise SystemExit("BLOCKED: immutable GHCR digest readback mismatch")
          expected=after.get("status",{}).get("latestCreatedRevisionName")
          if not expected or expected==before.get("status",{}).get("latestCreatedRevisionName"):
              raise SystemExit("BLOCKED: no verifiable candidate revision")
          if after.get("status",{}).get("latestReadyRevisionName")!=expected:
              raise SystemExit("BLOCKED: new candidate not ready")
          tags=[row for row in after.get("status",{}).get("traffic",[]) if row.get("revisionName")==expected]
          if not tags or any(row.get("percent",0)>0 for row in tags):
              raise SystemExit("BLOCKED: new revision unexpectedly receives formal traffic")
          print("zero_traffic_candidate="+sys.argv[3]+" revision="+expected+" traffic_preserved=PASS")
          PY
          done < "$RUNNER_TEMP/image-receipts.tsv"
      - name: Acceptance remains blocked until all real application gates pass
        shell: bash
        run: |
          {
            echo "### GHCR zero-traffic candidate checkpoint"
            echo "SHA: $RELEASE_SHA"
            echo "3 public GHCR digests verified anonymously; 3 Cloud Run 0%-formal-traffic candidates requested."
            echo "No production promotion, GCS/AR cleanup or Cloud Build trigger mutations."
            echo "**Production promotion: BLOCKED** until human OAuth/two-owner, durable Chat↔Gateway provider flow, Shared real-call acceptance, and rollback drill succeed."
            echo "Candidate creation is not production acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
