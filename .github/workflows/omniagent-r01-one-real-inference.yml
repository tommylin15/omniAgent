# One and only one real Gemini call after current exact-SHA verified-TLS
# canary; synthetic DB row is permanent no-replay guard.
name: omniAgent R01 one-shot real Chat inference
on:
  workflow_run:
    workflows: ['omniAgent R01 verified-TLS Chat canary']
    types: [completed]
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-r01-one-real-inference
  cancel-in-progress: false
jobs:
  one-shot:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'tommylin15/omniAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Enforce exactly-current authorized SHA with one-time marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          if git log -1 --format=%B | grep -Fq '[r01-real-once]'; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'r01_real_inference=NOOP_NO_ONE_TIME_MARKER' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.approved == 'true'
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.approved == 'true'
      - name: Execute at most one real Chat-to-Gateway Gemini request and read own DB
        if: steps.gate.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/r01_live_once.py "$SOURCE_SHA" "$RUNNER_TEMP/r01-one-shot.json"
          python3 - "$RUNNER_TEMP/r01-one-shot.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("r01_real_backend_inference="+d["status"])
          print("provider_post_count="+str(d["provider_post_count"]))
          print("db_terminal_status="+d["db_receipt"]["status"])
          print("db_text_events="+str(d["db_receipt"]["text_events"]))
          print("formal_traffic_mutated="+d["traffic_mutated"])
          print("automated_service_auth=YES")
          print("human_oauth_acceptance=NOT_REQUIRED")
          print("user_ui_e2e=NOT_TESTED")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.approved == 'true'
        with:
          name: r01-one-real-inference-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/r01-one-shot.json
          if-no-files-found: warn
          retention-days: 90
