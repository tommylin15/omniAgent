# R05 authentic owner mapping inventory only. No token minting or inference.
name: omniAgent R05 production Owner mapping inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-r05-owner-inventory.yml'
      - 'infra/gcp/r05-owner-inventory-readonly.sh'
permissions:
  contents: read
  id-token: write
jobs:
  production-owner-mapping-read-only:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact head and read-only script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          bash -n infra/gcp/r05-owner-inventory-readonly.sh
          python3 -m unittest discover -s tests -p test_r05_owner_inventory.py -v
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Aggregate live omniagent_chat Owner mapping counts, no user tokens
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash infra/gcp/r05-owner-inventory-readonly.sh > "$RUNNER_TEMP/r05-aggregate.txt"
          grep -qx 'r05_db_read_only=PASS_OWN_LOGICAL_DATABASE' "$RUNNER_TEMP/r05-aggregate.txt"
          grep -qx 'r05_two_user_oauth_api_e2e=NOT_VERIFIED_NO_DELEGATED_USER_TOKENS' "$RUNNER_TEMP/r05-aggregate.txt"
          cat "$RUNNER_TEMP/r05-aggregate.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-owner-mapping-aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/r05-aggregate.txt
          if-no-files-found: warn
          retention-days: 30
