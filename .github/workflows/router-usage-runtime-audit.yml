# One-time, data-minimizing production readback for RUA-02. No model calls,
# secret payload reads, database writes, IAM changes or traffic mutations.
name: Router usage runtime readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/router-usage-runtime-audit.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: router-usage-runtime-readback
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read only Cloud Run routes and non-secret feature flags
        shell: bash
        run: |
          set -euo pipefail
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/$svc.json"
            gcloud run revisions list --service="$svc" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/$svc-revisions.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          expected={
            'omniagent-chat':'omniagent-chat-00124-hup',
            'omniagent-agent-gateway':'omniagent-agent-gateway-00101-fec',
            'omniagent-shared-codex':'omniagent-shared-codex-00078-vap',
          }
          ok=True
          for service,revision in expected.items():
            data=json.loads((root/(service+'.json')).read_text())
            revisions=json.loads((root/(service+'-revisions.json')).read_text())
            status=data.get('status') or {}
            traffic=status.get('traffic') or []
            active=[(r.get('revisionName'),r.get('percent')) for r in traffic
                    if isinstance(r.get('percent'),int) and r['percent']>0]
            names={((r.get('metadata') or {}).get('name') or r.get('name')) for r in revisions}
            ready=status.get('latestReadyRevisionName')
            promoted=(len(active)==1 and active[0]==(revision,100) and revision in names and ready==revision)
            ok=ok and promoted
            env=((((data.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or [{}])[0].get('env') or []
            feature={r.get('name'):r for r in env if isinstance(r,dict)}
            entry={'service':service,'expected_revision':revision,'traffic_100_expected':promoted,
                   'latest_ready_expected':ready==revision,'revision_count':len(revisions),
                   'zero_percent_tags':sorted([{'tag':str(r.get('tag')),'revision':str(r.get('revisionName'))}
                     for r in traffic if r.get('tag') and not r.get('percent')],
                     key=lambda r:(r['tag'],r['revision']))}
            if service=='omniagent-chat':
              enabled=feature.get('ROUTER_USAGE_ENABLED') or {}
              admin=feature.get('ROUTER_USAGE_ADMIN_OWNER_IDS') or {}
              dsn=feature.get('ROUTER_USAGE_GATEWAY_DATABASE_URL') or {}
              ca=feature.get('ROUTER_USAGE_GATEWAY_CA_PEM') or {}
              entry.update({'router_usage_enabled':enabled.get('value')=='true',
                            'admin_owner_allowlist_configured':bool(admin.get('value') or admin.get('valueFrom')),
                            'gateway_readonly_db_configured':bool(dsn.get('value') or dsn.get('valueFrom')),
                            'gateway_verified_ca_configured':bool(ca.get('value') or ca.get('valueFrom'))})
            print(json.dumps(entry,sort_keys=True))
          print('release_traffic_readback='+('PASS' if ok else 'NOT_VERIFIED'))
          if not ok: raise SystemExit(1)
          PY
