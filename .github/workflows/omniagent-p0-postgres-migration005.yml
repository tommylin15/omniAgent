# Bounded Codex trial cap schema migration; no service traffic or inference.
name: omniAgent P0 PostgreSQL migration 005
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-p0-postgres-migration005.yml'
      - 'infra/gcp/apply-omniagent-chat-migration005.sh'
      - 'infra/postgres/migrations/005_codex_live_turns.sql'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-p0-postgres-migration005
  cancel-in-progress: false
jobs:
  apply-and-readback:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply migration 005 and read back target only
        shell: bash
        run: |
          set -euo pipefail
          bash infra/gcp/apply-omniagent-chat-migration005.sh | tee "$RUNNER_TEMP/migration005-receipt.txt"
          grep -qx 'migration005=PASS' "$RUNNER_TEMP/migration005-receipt.txt"
          cat "$RUNNER_TEMP/migration005-receipt.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omniagent-migration005-${{ github.sha }}
          path: ${{ runner.temp }}/migration005-receipt.txt
          if-no-files-found: warn
          retention-days: 90
