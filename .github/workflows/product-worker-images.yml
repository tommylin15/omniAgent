name: omniAgent product worker image publish
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed exact main SHA to build; no deployments or traffic changes
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: omniagent-product-worker-images
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [agent-worker, job-worker, archive-writer]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - name: Verify reviewed source is main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable worker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/tommylin15/omniagent/${{ matrix.service }}:sha-${{ inputs.source_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Record image receipt
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "source_sha=$SOURCE_SHA service=$SERVICE image=ghcr.io/tommylin15/omniagent/$SERVICE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment and runtime acceptance: NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
