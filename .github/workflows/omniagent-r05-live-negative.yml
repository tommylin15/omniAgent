# R05 real Cloud Run denial boundary; no human OAuth or provider invocation.
name: omniAgent R05 live invalid-user boundary
on:
  workflow_run:
    workflows: ["omniAgent GHCR current candidate auto smoke"]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  owner-negative:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'tommylin15/omniAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Enforce exact current main and negative-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python3 -m unittest discover -s tests -p test_r05_live_negative.py -v
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe only invalid OAuth and spoofed Owner against 0%-traffic Chat
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/r05_live_auth_negative.py "$SOURCE_SHA" > "$RUNNER_TEMP/r05-live-negative.txt"
          grep -qx 'r05_live_candidate_invalid_user_auth=PASS' "$RUNNER_TEMP/r05-live-negative.txt"
          grep -qx 'r05_formal_traffic_unchanged=PASS' "$RUNNER_TEMP/r05-live-negative.txt"
          grep -qx 'r05_model_provider_calls=ZERO' "$RUNNER_TEMP/r05-live-negative.txt"
          grep -qx 'r05_valid_two_user_oauth_e2e=NOT_VERIFIED_NO_DELEGATED_USER_TOKENS' "$RUNNER_TEMP/r05-live-negative.txt"
          cat "$RUNNER_TEMP/r05-live-negative.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-live-auth-negative-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/r05-live-negative.txt
          if-no-files-found: warn
          retention-days: 30
