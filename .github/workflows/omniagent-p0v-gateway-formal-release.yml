# P0-V Gateway-only activation. Never run the generic three-service one-shot workflow.
# Ordinary push = authenticated READ-ONLY preflight; paid smoke and traffic change require
# a main-only manual dispatch with exact explicit confirmation.
name: omniAgent P0-V Gateway-only formal release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-p0v-gateway-formal-release.yml'
      - 'scripts/p0v_gateway_formal_release.py'
      - 'tests/test_p0v_gateway_formal_release.py'
  workflow_dispatch:
    inputs:
      operation:
        description: 'preflight (read-only) or activate (real Gateway production promotion)'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - activate
      confirmation:
        description: 'For activate only: type ACTIVATE_P0V_GATEWAY_ONLY'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-ghcr-formal-production
  cancel-in-progress: false
jobs:
  gateway-only:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPERATION: ${{ inputs.operation || 'preflight' }}
      CONFIRMATION: ${{ inputs.confirmation || '' }}
      RECEIPT: p0v-gateway-only-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fail-closed Gateway-only release unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p0v_gateway_formal_release.py' -v
      - name: Enforce release operation and branch guard
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            preflight) echo 'MODE=preflight' >> "$GITHUB_ENV" ;;
            activate)
              test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
              test "$CONFIRMATION" = "ACTIVATE_P0V_GATEWAY_ONLY"
              echo 'MODE=activate' >> "$GITHUB_ENV"
              ;;
            *) echo '::error::Unknown Gateway release operation'; exit 1 ;;
          esac
          echo "p0v_gateway_operation=$OPERATION" >> "$GITHUB_STEP_SUMMARY"
          echo 'scope=GATEWAY_ONLY__NO_REVISION_CLEANUP' >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only GCP baseline or explicitly activated Gateway-only release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/p0v_gateway_formal_release.py \
            --mode "$MODE" \
            --confirm "$CONFIRMATION" \
            --source-sha "$GITHUB_SHA" \
            --receipt "$RECEIPT"
          python3 - "$RECEIPT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          receipt=json.loads(Path(sys.argv[1]).read_text())
          with open(sys.argv[2],"a") as summary:
              summary.write("gateway_release_status="+receipt["status"]+"\n")
              summary.write("traffic_mutation_attempted="+str(receipt["traffic_mutation_attempted"])+"\n")
              summary.write("emergency_recovery="+receipt["emergency_recovery"]+"\n")
              summary.write("provider_call_upper_bound="+str(receipt["model_calls_attempted_max"])+"\n")
              summary.write("revision_cleanup_attempted="+str(receipt["revision_cleanup_attempted"])+"\n")
          PY
      - name: Preserve redacted Gateway-only release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0v-gateway-only-${{ github.run_id }}
          path: p0v-gateway-only-receipt.json
          if-no-files-found: warn
          retention-days: 90
