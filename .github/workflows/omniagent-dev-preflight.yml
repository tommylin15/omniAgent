name: omniAgent dev GCP preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-dev-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment-only WIF identity
        shell: bash
        run: |
          echo "Using existing GitHub WIF provider and shared CI deployment identity."
          echo "Runtime service accounts, OAuth credentials and Secret Manager values are not read or changed by this step."

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: janus-ci@gen-lang-client-0593591102.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP identity and omniAgent candidate resources
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          echo "project=$(gcloud config get-value project)"
          echo "account=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "== Cloud Run candidates =="
          for svc in omniagent-chat omniagent-agent-gateway; do
            if gcloud run services describe "$svc" --region="$GCP_REGION"               --format='value(metadata.name,status.url,status.latestReadyRevisionName)' 2>/tmp/"$svc".err; then
              true
            else
              echo "$svc: not readable or not present"
              cat /tmp/"$svc".err
            fi
          done
          echo "== Artifact Registry repo =="
          gcloud artifacts repositories describe janusai-poc             --location="$GCP_REGION"             --format='value(name,format)'