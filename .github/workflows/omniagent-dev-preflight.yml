name: omniAgent dev GCP preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-dev-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  OMNIAGENT_GCP_WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  OMNIAGENT_GCP_CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
  OMNIAGENT_ARTIFACT_REPOSITORY: omniagent

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tracked omniAgent deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OMNIAGENT_GCP_WIF_PROVIDER"
          test -n "$OMNIAGENT_GCP_CI_SERVICE_ACCOUNT"
          test -n "$OMNIAGENT_ARTIFACT_REPOSITORY"
          bash -n infra/gcp/bootstrap-omniagent-ci.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.OMNIAGENT_GCP_WIF_PROVIDER }}
          service_account: ${{ env.OMNIAGENT_GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP identity and omniAgent resources
        shell: bash
        env:
          ARTIFACT_REPOSITORY: ${{ env.OMNIAGENT_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          echo "project=$(gcloud config get-value project)"
          echo "account=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          for svc in omniagent-chat omniagent-agent-gateway; do
            if gcloud run services describe "$svc" --region="$GCP_REGION"               --format='value(metadata.name,status.url,status.latestReadyRevisionName)'; then
              true
            else
              echo "$svc: not readable or not present"
            fi
          done
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY"             --location="$GCP_REGION"             --format='value(name,format)'
