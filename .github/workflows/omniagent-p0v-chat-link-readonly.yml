name: omniAgent Chat P0-V link and readiness readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-p0v-chat-link-readonly.yml']
permissions:
  contents: read
  id-token: write
jobs:
  read:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Resolve exact zero-traffic Chat candidate URL and check health
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe omniagent-chat --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/chat.json"
          python3 - "$RUNNER_TEMP/chat.json" "$RUNNER_TEMP/candidate-url" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          status=doc.get("status") or {}
          traffic=status.get("traffic") or []
          serving=[row for row in traffic if row.get("percent",0)>0]
          candidate=[row for row in traffic if row.get("tag")=="p0v-gemini-chat-1cb6542b"
                     and row.get("percent",0)==0 and row.get("revisionName")]
          if len(serving)!=1 or serving[0].get("percent")!=100 or len(candidate)!=1:
              raise SystemExit("BLOCKED: active allocation or tagged pilot changed")
          url=candidate[0].get("url","").rstrip("/")
          if not (url.startswith("https://") and url.endswith(".a.run.app")):
              raise SystemExit("BLOCKED: candidate URL unexpected")
          with open(sys.argv[2],"w") as f:f.write(url)
          print("verified_chat_p0v_url="+url)
          print("chat_p0v_source_tag=p0v-gemini-chat-1cb6542b")
          print("chat_p0v_revision="+candidate[0]["revisionName"])
          print("production_traffic_untouched=PASS")
          preview=[row for row in traffic if row.get("tag")=="preview"]
          if len(preview)==1:
              print("fixed_preview_revision="+str(preview[0].get("revisionName","UNKNOWN")))
              print("fixed_preview_percent="+str(preview[0].get("percent",0)))
              print("fixed_preview_url="+str(preview[0].get("url","UNKNOWN")))
              print("fixed_preview_points_to_gemini_owner_canary="+str(
                 preview[0].get("revisionName")==candidate[0].get("revisionName")))
          else:
              print("fixed_preview_tag="+("ABSENT" if not preview else "INVALID_DUPLICATE"))
          PY
          URL="$(cat "$RUNNER_TEMP/candidate-url")"
          for p in /health /ready / /main.dart.js; do
            status="$(curl --max-time 25 -sS -o /dev/null -w '%{http_code}' "$URL$p")"
            echo "candidate_get_$p=$status"
            test "$status" = 200
          done
          for p in /v1/models /v1/threads; do
            status="$(curl --max-time 25 -sS -o /dev/null -w '%{http_code}' "$URL$p")"
            echo "anonymous_get_$p=$status"
            test "$status" = 401
          done
          echo "real_google_user_oauth_login_and_model_reply=NOT_VERIFIED_NO_USER_TOKEN"
          echo "provider_inference_requests=ZERO"
