# One-time post-promotion cleanup; current production already verified separately.
# No build, provider call, OAuth interaction, DB change or rollout in this job.
name: omniAgent GHCR postrelease protected-ten retention
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-postrelease-retention.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-ghcr-postrelease-protected-retention
  cancel-in-progress: false
jobs:
  protect-ten:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[retention-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      DEPLOYED_SHA: 02ef7f682ed16e6bb4f0f57507bad4b88b8f02c2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact main and deterministic protected retention tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_cloudrun_revision_retention.py' -v
          python3 -m unittest discover -s tests -p 'test_cloudrun_revision_tag_retirement.py' -v
          echo 'protected_ten_unit_tests=PASS'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read current 100-percent traffic, GHCR digests, Ready fallback and Secret states
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import re,subprocess
          from ghcr_release_readiness import gcloud,enabled_secrets,FALLBACK_DIGEST
          expected={
            "omniagent-chat":("omniagent-chat-00063-zis","omniagent-chat-00045-fer",
              "sha256:de26528c8c100396eefc5107e2b023ae33207f0c6331d2e0a1b1c9784ad5c843"),
            "omniagent-agent-gateway":("omniagent-agent-gateway-00054-met","omniagent-agent-gateway-00036-hid",
              "sha256:91f88f59851f7eb5dafac2884fc27a856eea2f30a43634829ce8465026582c4f"),
            "omniagent-shared-codex":("omniagent-shared-codex-00040-pon","omniagent-shared-codex-00024-naw",
              "sha256:9b0f777f09a2598dcf9025faf4bd33b0630c42284614c7ab86932dbb8089f863"),
          }
          def secret_state(name,version):
              result=subprocess.run(["gcloud","secrets","versions","describe",version,
                 "--secret="+name,"--project=gen-lang-client-0593591102","--format=value(state)"],
                 check=True,text=True,capture_output=True,timeout=45)
              return result.stdout.strip()
          for svc,(promoted,fallback,digest) in expected.items():
              doc=gcloud("services",svc)
              status=doc.get("status") or {}
              active=[r for r in status.get("traffic") or [] if r.get("percent",0)>0]
              if len(active)!=1 or active[0].get("percent")!=100 or active[0].get("revisionName")!=promoted:
                  raise SystemExit("BLOCKED: formal_traffic_drift_"+svc)
              if status.get("latestCreatedRevisionName")!=promoted or status.get("latestReadyRevisionName")!=promoted:
                  raise SystemExit("BLOCKED: unexpected_new_revision_"+svc)
              for kind,revision,d in (("promoted",promoted,digest),("fallback",fallback,FALLBACK_DIGEST[svc])):
                  rev=gcloud("revisions",revision)
                  containers=(rev.get("spec") or {}).get("containers") or []
                  if len(containers)!=1 or not str(containers[0].get("image","")).endswith("@"+d):
                      raise SystemExit("BLOCKED: revision_digest_"+svc+"_"+kind)
                  if not any(c.get("type")=="Ready" and c.get("status")=="True"
                             for c in (rev.get("status") or {}).get("conditions") or []):
                      raise SystemExit("BLOCKED: revision_not_ready_"+svc+"_"+kind)
                  enabled_secrets(rev,secret_state)
              print("protected_pair_and_traffic_"+svc+"=PASS")
          print("formal_traffic_unchanged=PASS")
          print("read_only_secret_metadata=PASS")
          PY
      - name: Dry-run obsolete tag retirement including simulated protected-ten deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-shared-codex \
            --promoted-revision omniagent-shared-codex-00040-pon --rollback-revision omniagent-shared-codex-00024-naw
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-agent-gateway \
            --promoted-revision omniagent-agent-gateway-00054-met --rollback-revision omniagent-agent-gateway-00036-hid
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-chat \
            --promoted-revision omniagent-chat-00063-zis --rollback-revision omniagent-chat-00045-fer
          echo 'protected_tag_dry_run=PASS'
      - name: Retire only now-obsolete GHCR candidate tags
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-shared-codex \
            --promoted-revision omniagent-shared-codex-00040-pon --rollback-revision omniagent-shared-codex-00024-naw --apply
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-agent-gateway \
            --promoted-revision omniagent-agent-gateway-00054-met --rollback-revision omniagent-agent-gateway-00036-hid --apply
          python3 scripts/cloudrun_revision_tag_retirement.py --service omniagent-chat \
            --promoted-revision omniagent-chat-00063-zis --rollback-revision omniagent-chat-00045-fer --apply
          echo 'protected_tag_retirement=PASS'
      - name: Recheck protected-ten plan without obsolete tags
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudrun_revision_retention.py --service omniagent-shared-codex \
            --promoted-revision omniagent-shared-codex-00040-pon --rollback-revision omniagent-shared-codex-00024-naw
          python3 scripts/cloudrun_revision_retention.py --service omniagent-agent-gateway \
            --promoted-revision omniagent-agent-gateway-00054-met --rollback-revision omniagent-agent-gateway-00036-hid
          python3 scripts/cloudrun_revision_retention.py --service omniagent-chat \
            --promoted-revision omniagent-chat-00063-zis --rollback-revision omniagent-chat-00045-fer
          echo 'protected_revision_dry_run=PASS'
      - name: Delete only unreferenced revisions beyond protected ten
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cloudrun_revision_retention.py --service omniagent-shared-codex \
            --promoted-revision omniagent-shared-codex-00040-pon --rollback-revision omniagent-shared-codex-00024-naw --apply
          python3 scripts/cloudrun_revision_retention.py --service omniagent-agent-gateway \
            --promoted-revision omniagent-agent-gateway-00054-met --rollback-revision omniagent-agent-gateway-00036-hid --apply
          python3 scripts/cloudrun_revision_retention.py --service omniagent-chat \
            --promoted-revision omniagent-chat-00063-zis --rollback-revision omniagent-chat-00045-fer --apply
          echo 'protected_revision_deletion=PASS'
      - name: Verify at most ten remain, protected fallback retained, 100 percent traffic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          expected={
            "omniagent-chat":("omniagent-chat-00063-zis","omniagent-chat-00045-fer"),
            "omniagent-agent-gateway":("omniagent-agent-gateway-00054-met","omniagent-agent-gateway-00036-hid"),
            "omniagent-shared-codex":("omniagent-shared-codex-00040-pon","omniagent-shared-codex-00024-naw"),
          }
          def get(*args):
              return json.loads(subprocess.run(["gcloud",*args,"--project=gen-lang-client-0593591102",
                "--region=us-central1","--format=json"],check=True,text=True,
                capture_output=True,timeout=55).stdout)
          for service,(primary,fallback) in expected.items():
              revs=get("run","revisions","list","--service="+service)
              names={str((x.get("metadata") or {}).get("name") or x.get("name")) for x in revs}
              if len(revs)>10 or primary not in names or fallback not in names:
                  raise SystemExit("BLOCKED: protected_ten_readback_"+service)
              status=get("run","services","describe",service).get("status") or {}
              live=[r for r in status.get("traffic") or [] if r.get("percent",0)>0]
              if len(live)!=1 or live[0].get("percent")!=100 or live[0].get("revisionName")!=primary:
                  raise SystemExit("BLOCKED: formal_traffic_readback_"+service)
              print("protected_ten_"+service+"=PASS count="+str(len(revs)))
          print("manual_oauth_gate=NOT_REQUIRED")
          print("provider_inference=NOT_RUN")
          print("postrelease_protected_retention=PASS")
          PY
          echo 'Protected ten retained, verified fallback and 100% formal GHCR traffic PASS.' >> "$GITHUB_STEP_SUMMARY"
