# Explicit one-time Owner-approved A1 trial staging. NOT a formal release.
# Starts after exact-SHA signed smoke, with immutable 0%-traffic revisions.
name: omniAgent P0 Owner three-turn staging
on:
  workflow_run:
    workflows: ["omniAgent GHCR current candidate auto smoke"]
    types: [completed]
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-p0-owner-staging
  cancel-in-progress: false
jobs:
  stage-owner-canary:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'tommylin15/omniAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Enforce approved single SHA and trial marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          if git log -1 --format=%B | grep -Fq '[release-once]'; then
            # Production-only authorization must never start a billable
            # Owner canary; this is an expected no-op, not a CI failure.
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'p0_trial_stage=BLOCKED_CONFLICTING_FORMAL_RELEASE_MARKER__EXPECTED_NOOP' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git log -1 --format=%B | grep -Fq '[p0-trial-once]'; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'p0_trial_stage=NOOP_NO_EXPLICIT_MARKER' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.authorized == 'true'
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.authorized == 'true'
      - name: Verify direct Secret IAM grant without reading credential
        if: steps.gate.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash infra/gcp/p0-owner-identity-preflight.sh > "$RUNNER_TEMP/identity.txt"
          grep -qx 'owner_identity=PASS_DB_BACKED_OAUTH_OWNER' "$RUNNER_TEMP/identity.txt"
          grep -qx 'shared_secret_latest_version=ENABLED' "$RUNNER_TEMP/identity.txt"
          grep -qx 'shared_secret_iam_access=VERIFIED_DIRECT_ACCESSOR' "$RUNNER_TEMP/identity.txt"
          echo 'owner_identity_and_secret_iam=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Enroll precisely one DB Owner without resetting allowance
        if: steps.gate.outputs.authorized == 'true'
        id: enrollment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! bash infra/gcp/p0-owner-trial-enroll.sh > "$RUNNER_TEMP/enrollment.txt"; then
            grep -E '^trial_(enrollment|budget)' "$RUNNER_TEMP/enrollment.txt" || :
            exit 1
          fi
          grep -E '^trial_(enrollment|budget)' "$RUNNER_TEMP/enrollment.txt" || :
          grep -qx 'trial_enrollment=PASS_NO_RESET' "$RUNNER_TEMP/enrollment.txt"
          grep -qx 'trial_budget_max=3' "$RUNNER_TEMP/enrollment.txt"
          owner="$(sed -n 's/^owner_id=//p' "$RUNNER_TEMP/enrollment.txt")"
          [[ "$owner" =~ ^[0-9a-f-]{36}$ ]]
          echo "::add-mask::$owner"
          printf 'owner_id=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          grep -v '^owner_id=' "$RUNNER_TEMP/enrollment.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy tagged zero-traffic Owner revisions then restore latest templates
        if: steps.gate.outputs.authorized == 'true'
        shell: bash
        env:
          TRIAL_OWNER: ${{ steps.enrollment.outputs.owner_id }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/p0_owner_trial_stage.py "$RELEASE_SHA" "$TRIAL_OWNER" "$RUNNER_TEMP/trial-stage.json"
          echo 'p0_trial_staging=PASS_ZERO_TRAFFIC' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/trial-stage.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omniagent-p0-trial-stage-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/trial-stage.json
          if-no-files-found: warn
          retention-days: 30
