name: omniAgent Preview Chat create-thread read-only diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-p0v-chat-create-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      EXPECTED_REV: omniagent-chat-00077-xas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check fixed Preview routing and Cloud Logging without user data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe omniagent-chat --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/chat.json"
          python3 - "$RUNNER_TEMP/chat.json" <<'PY'
          import json,sys,os
          svc=json.load(open(sys.argv[1]))
          routes=(svc.get("status") or {}).get("traffic") or []
          preview=[x for x in routes if x.get("tag")=="preview" and x.get("percent",0)==0]
          if len(preview)!=1 or preview[0].get("revisionName")!=os.environ["EXPECTED_REV"]:
              raise SystemExit("BLOCKED: fixed Preview no longer points to accepted owner canary")
          print("preview_revision=VERIFIED")
          print("preview_traffic=ZERO")
          print("formal_traffic=UNCHANGED_BY_WORKFLOW")
          PY
          # Cloud Logging output is written to private temp only; the allowed
          # stdout contains time buckets and HTTP/status/error PHASE, never
          # request URLs, remote IP, user IDs, trace IDs or prompt contents.
          if gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"omniagent-chat\" AND resource.labels.revision_name=\"$EXPECTED_REV\" AND timestamp>=\"2026-10-13T08:00:00Z\"" \
               --project="$PROJECT" --limit=250 --format=json > "$RUNNER_TEMP/logs.json" 2>"$RUNNER_TEMP/logerr"; then
            python3 - "$RUNNER_TEMP/logs.json" <<'PY'
          import collections,json,sys
          rows=json.load(open(sys.argv[1]))
          print("cloud_logging_read=PASS")
          status=collections.Counter()
          audit=collections.Counter()
          for row in rows:
              req=row.get("httpRequest") or {}
              text=row.get("jsonPayload") or {}
              if req:
                  target=req.get("requestUrl") or ""
                  if "/v1/threads" in target and "/messages" not in target:
                      # Report only bounded create-thread paths, not URL.
                      method=req.get("requestMethod","")
                      if method=="POST":
                          status[str(req.get("status","UNKNOWN"))]+=1
              if text.get("kind")=="omniagent_chat_request_audit":
                  if text.get("phase") in ("request_failed","thread_committed"):
                      audit[(text.get("phase"),text.get("outcome"))]+=1
              payload=row.get("textPayload") or ""
              if isinstance(payload,str) and '"kind":"omniagent_chat_request_audit"' in payload:
                  try: audit_row=json.loads(payload.strip())
                  except ValueError:continue
                  if audit_row.get("phase") in ("request_failed","thread_committed"):
                      audit[(audit_row.get("phase"),audit_row.get("outcome"))]+=1
          print("observed_POST_v1_threads_status_counts="+json.dumps(status,sort_keys=True))
          print("observed_safe_chat_audit_counts="+json.dumps([
             {"phase":k[0],"outcome":k[1],"count":v}
              for k,v in sorted(audit.items())],sort_keys=True))
          PY
          else
            echo "cloud_logging_read=UNAVAILABLE_PERMISSION_OR_SERVICE"
          fi
      - name: Read only omniagent_chat schema and thread count
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HOST="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          CONTAINER="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          # Existing omniAgent-only DB, never other databases, row details,
          # Google OAuth subjects or prompt/event content.
          if gcloud compute ssh "$HOST" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet \
              --command="sudo docker exec -u postgres $CONTAINER psql -X -A -t -v ON_ERROR_STOP=1 -d omniagent_chat -c \"SELECT 'table=' || table_name || ';columns=' || string_agg(column_name,',' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_schema='omni_chat' AND table_name IN ('owners','threads','turns') GROUP BY table_name ORDER BY table_name; SELECT 'threads_count=' || count(*) FROM omni_chat.threads; \"" \
                > "$RUNNER_TEMP/db-schema.txt" 2>"$RUNNER_TEMP/db.err"; then
              grep -E '^(table=|threads_count=)' "$RUNNER_TEMP/db-schema.txt" || true
              echo "chat_db_metadata_read=PASS"
          else
              echo "chat_db_metadata_read=NOT_VERIFIED"
          fi
