# One-shot non-billable, read-only correlation for the reported Owner A answer.
# Does not request human OAuth or invoke Codex/provider.
name: omniAgent P0 request-origin and DB correlation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-p0-correlation-triage.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-p0-correlation-readonly
  cancel-in-progress: false
jobs:
  correlate:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare trial URL, current formal Chat and tagged revision metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe omniagent-chat --project="$PROJECT" --region="$REGION" \
            --format=json > "$RUNNER_TEMP/chat-service.json"
          python3 - "$RUNNER_TEMP/chat-service.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          traffic=(doc.get("status") or {}).get("traffic") or []
          live=[r for r in traffic if r.get("percent",0)>0]
          trial=[r for r in traffic if r.get("tag")=="p0-trial-effb7b08c8d5"]
          if len(live)!=1 or live[0].get("percent")!=100:
              raise SystemExit("BLOCKED: invalid production traffic")
          print("current_chat_formal_100=PASS")
          if (len(trial)==1 and trial[0].get("percent",0)==0 and
              trial[0].get("revisionName")!=live[0].get("revisionName")):
              print("historical_trial_0pct_tag=PRESENT")
          else:
              print("historical_trial_0pct_tag=NOT_VERIFIED")
          print("historic_reported_browser_origin=NOT_CAPTURED")
          print("matching_human_user_token=NOT_AVAILABLE_FOR_AUTOMATION")
          PY
      - name: Read only historical request log classes (no URL/ID/body emitted)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          query='resource.type="cloud_run_revision" AND resource.labels.service_name="omniagent-chat" AND timestamp>="2026-10-11T12:55:00Z" AND timestamp<="2026-10-12T04:00:00Z" AND httpRequest.requestMethod="POST"'
          if gcloud logging read "$query" --project="$PROJECT" --limit=1000 \
              --format=json > "$RUNNER_TEMP/http-requests.json" 2>"$RUNNER_TEMP/logging-error.txt"; then
            python3 - "$RUNNER_TEMP/http-requests.json" <<'PY'
          import json,sys
          from urllib.parse import urlsplit
          obj=json.load(open(sys.argv[1]))
          found={"create_thread":0,"send_message":0,"other":0}
          trial={"create_thread":0,"send_message":0}
          for row in obj:
              path=urlsplit(str((row.get("httpRequest") or {}).get("requestUrl",""))).path
              if path=="/v1/threads":
                  kind="create_thread"
              elif path.startswith("/v1/threads/") and path.endswith("/messages"):
                  kind="send_message"
              else:
                  kind="other"
              found[kind]+=1
              if "p0-trial-" in str((row.get("httpRequest") or {}).get("requestUrl","")) and kind in trial:
                  trial[kind]+=1
          # Exact request URL, client IP, owner, path params and timestamps
          # never emitted. Limited log query cannot establish an exhaustive zero.
          print("post_log_query=AVAILABLE_LIMITED")
          for kind in ("create_thread","send_message"):
              print("historical_"+kind+"_observed="+("PRESENT" if found[kind] else "NONE_IN_QUERY"))
              print("trial_"+kind+"_observed="+("PRESENT" if trial[kind] else "NONE_IN_QUERY"))
          PY
          else
            echo 'post_log_query=UNAVAILABLE_NO_ACCESS_OR_LOGS'
          fi
      - name: Canonical Owner A DB and budget aggregate readback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bash -n infra/gcp/p0-owner-live-readback.sh
          code=0
          bash infra/gcp/p0-owner-live-readback.sh > "$RUNNER_TEMP/canonical.txt" || code=$?
          grep '^p0_' "$RUNNER_TEMP/canonical.txt" || :
          if [ "$code" -eq 0 ]; then
            echo 'historical_owner_a_durable_db=PASS'
          else
            echo 'historical_owner_a_durable_db=BLOCKED'
          fi
          echo 'provider_calls=ZERO'
          echo 'budget_writes=ZERO'
          echo 'live_owner_b_google_oauth=NOT_VERIFIED_AUTOMATION_UNAVAILABLE'
      - name: Summarize scope
        if: always()
        run: |
          {
            echo '### P0 historical correlation: read-only'
            echo 'No OAuth token supplied/printed, no provider calls or trial reset.'
            echo 'No retrospective root-cause claims without a matched origin+request+DB event.'
            echo 'Current source CI and isolated fixture pass do not prove historical real Codex.'
          } >> "$GITHUB_STEP_SUMMARY"
