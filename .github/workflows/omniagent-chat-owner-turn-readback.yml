name: omniAgent Chat Owner durable turn read-only evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-chat-owner-turn-readback.yml']
permissions:
  contents: read
  id-token: write
jobs:
  read:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify approved OAuth Owner privately, never log identifiers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HOST="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          CONTAINER="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          gcloud compute ssh "$HOST" --zone=us-central1-a --project=gen-lang-client-0593591102 \
            --tunnel-through-iap --quiet \
            --command="sudo docker exec -u postgres $CONTAINER psql -X -A -t -v ON_ERROR_STOP=1 -d omniagent_chat -c \"SELECT owner_id FROM omni_chat.owners WHERE issuer='https://accounts.google.com' AND subject<>''\"" \
            > "$RUNNER_TEMP/owners.private" 2>"$RUNNER_TEMP/owner-read.stderr"
          python3 - "$RUNNER_TEMP/owners.private" "$GITHUB_ENV" <<'PY'
          import hashlib,re,sys
          expected="bd46f8f29ba78faaa606f03d6a760c1726ce27a7cd75381d5c04b9525861f70f"
          mask=re.compile(r"^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$")
          approved=[x.strip().lower() for x in open(sys.argv[1]) if mask.fullmatch(x.strip().lower()) and
                    hashlib.sha256(x.strip().lower().encode()).hexdigest()==expected]
          if len(approved)!=1:
              raise SystemExit("BLOCKED: approved OAuth-backed Owner identity absent or ambiguous")
          print("::add-mask::"+approved[0])
          with open(sys.argv[2],"a") as f:f.write("APPROVED_OWNER="+approved[0]+"\n")
          print("owner_identity=PASS_DIGEST_MATCH_OAUTH_DB")
          PY
          rm -f "$RUNNER_TEMP/owners.private"
      - name: Query own Chat turn receipts without message contents
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HOST="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          CONTAINER="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          cat > "$RUNNER_TEMP/check.sql" <<SQL
          \set ON_ERROR_STOP on
          BEGIN TRANSACTION READ ONLY;
          WITH candidate_threads AS (
            SELECT thread_id, owner_id FROM omni_chat.threads
            WHERE owner_id='${APPROVED_OWNER}'::uuid
              AND runtime='gemini'
              AND model='gemini-3.5-flash-lite'
              AND created_at >= '2026-10-13T09:11:00Z'::timestamptz
          ), receipts AS (
            SELECT t.turn_id,t.owner_id,t.thread_id,t.status,
              EXISTS (SELECT 1 FROM omni_chat.events e
                WHERE e.owner_id=t.owner_id AND e.thread_id=t.thread_id
                  AND e.turn_id=t.turn_id AND e.event_type='text_delta'
                  AND length(btrim(COALESCE(NULLIF(e.payload->>'text',''),
                    NULLIF(e.payload->>'delta',''),'')))>0
              ) AS text_persisted,
              EXISTS (SELECT 1 FROM omni_chat.events e
                WHERE e.owner_id=t.owner_id AND e.thread_id=t.thread_id
                  AND e.turn_id=t.turn_id AND e.event_type='turn_completed'
              ) AS terminal_persisted
            FROM omni_chat.turns t JOIN candidate_threads th
              ON th.owner_id=t.owner_id AND th.thread_id=t.thread_id
            WHERE t.created_at >= '2026-10-13T09:11:00Z'::timestamptz
          )
          SELECT 'owner_recent_gemini_threads=' || (SELECT count(*) FROM candidate_threads)
          UNION ALL SELECT 'owner_recent_gemini_turns=' || count(*) FROM receipts
          UNION ALL SELECT 'owner_completed_gemini_turns=' || count(*) FROM receipts WHERE status='COMPLETED'
          UNION ALL SELECT 'owner_text_persisted_turns=' || count(*) FROM receipts WHERE text_persisted
          UNION ALL SELECT 'owner_terminal_persisted_turns=' || count(*) FROM receipts WHERE terminal_persisted
          UNION ALL SELECT 'owner_durable_completed_turns=' || count(*) FROM receipts
            WHERE status='COMPLETED' AND text_persisted AND terminal_persisted;
          ROLLBACK;
          SQL
          B64="$(base64 -w0 < "$RUNNER_TEMP/check.sql")"
          gcloud compute ssh "$HOST" --zone=us-central1-a --project=gen-lang-client-0593591102 \
            --tunnel-through-iap --quiet \
            --command="printf '%s' '$B64' | base64 -d | sudo docker exec -i -u postgres $CONTAINER psql -X -A -t -v ON_ERROR_STOP=1 -d omniagent_chat" \
            > "$RUNNER_TEMP/receipt.private" 2>"$RUNNER_TEMP/receipt-read.stderr"
          grep -E '^owner_(recent_gemini_threads|recent_gemini_turns|completed_gemini_turns|text_persisted_turns|terminal_persisted_turns|durable_completed_turns)=[0-9]+$' "$RUNNER_TEMP/receipt.private"
          grep -qx 'ROLLBACK' "$RUNNER_TEMP/receipt.private"
          echo "owner_postgres_readback=PASS_READ_ONLY"
          echo "real_browser_UI_after_refresh=USER_OBSERVATION_REQUIRED"
