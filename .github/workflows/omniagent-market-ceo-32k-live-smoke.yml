# Read-only Cloud Run candidate routing; one bounded market-mart Gemini call.
# Does NOT change IAM, deployments, tags, formal traffic, data, or provider keys.
name: omniAgent market-mart 32KiB CEO Gateway candidate smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-market-ceo-32k-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  acceptance:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      SERVICE: omniagent-agent-gateway
      SOURCE_SHA: 965b05542a35631feb1e663e1a2a58cf1bd92198
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect exact zero-traffic Gateway image, feature and IAM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/gateway.json"
          gcloud run services get-iam-policy "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/gateway-iam.json"
          python3 - "$RUNNER_TEMP/gateway.json" "$RUNNER_TEMP/gateway-iam.json" "$GITHUB_ENV" <<'PY'
          import json,os,re,sys
          gateway,iam=(json.load(open(x)) for x in sys.argv[1:3])
          routes=(gateway.get("status") or {}).get("traffic") or []
          serving=[r for r in routes if r.get("percent",0)>0]
          if len(serving)!=1 or serving[0].get("percent")!=100:
              raise SystemExit("BLOCKED: production serving allocation differs from one 100% revision")
          sha=os.environ["SOURCE_SHA"]
          tag="ghcr-"+sha[:12]
          candidates=[r for r in routes if r.get("tag")==tag and r.get("percent",0)==0]
          if len(candidates)!=1:
              raise SystemExit("BLOCKED: approved new code candidate unavailable at 0%")
          url=candidates[0].get("url","").rstrip("/")
          audience=(gateway.get("status") or {}).get("url","").rstrip("/")
          if not (url.startswith("https://") and url.endswith(".a.run.app") and
                  audience.startswith("https://") and audience.endswith(".a.run.app")):
              raise SystemExit("BLOCKED: unexpected candidate/audience URL")
          members={x for b in iam.get("bindings") or [] if b.get("role")=="roles/run.invoker"
                   for x in b.get("members") or []}
          market="omniagent-codex-market-client@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
          life="omniagent-codex-life-client@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
          if any(x in members for x in ("allUsers","allAuthenticatedUsers")) or any(
                  "serviceAccount:"+a not in members for a in (market,life)):
              raise SystemExit("BLOCKED: private IAM/dedicated callers not verified")
          with open(sys.argv[3],"a") as f:
              f.write("CAPACITY_PILOT_URL="+url+"\n")
              f.write("CAPACITY_AUDIENCE="+audience+"\n")
              f.write("CAPACITY_CANDIDATE_REV="+candidates[0]["revisionName"]+"\n")
          print("candidate_identity=PASS_GHCR_ZERO_TRAFFIC")
          print("private_caller_iam=PASS")
          print("canonical_audience=PASS")
          print("candidate_url="+url)
          PY
      - name: Verify candidate runtime configuration after GITHUB_ENV propagation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/gateway.json"
          gcloud run revisions describe "$CAPACITY_CANDIDATE_REV" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          python3 - "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/gateway.json" <<'PY'
          import json,os,sys,re
          candidate,svc=(json.load(open(x)) for x in sys.argv[1:3])
          ready=(candidate.get("status") or {}).get("conditions") or []
          if not any(c.get("type")=="Ready" and c.get("status")=="True" for c in ready):
              raise SystemExit("BLOCKED: tagged candidate not Ready")
          containers=(candidate.get("spec") or {}).get("containers") or []
          original=(((svc.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers") or []
          if len(containers)!=1 or len(original)!=1:
              raise SystemExit("BLOCKED: unexpected Gateway container shape")
          actual=containers[0].get("image","").removeprefix("cache.us-docker.pkg.dev/")
          expected=original[0].get("image","")
          if not re.fullmatch(r"ghcr\.io/tommylin15/omniagent-agent-gateway@sha256:[a-f0-9]{64}",expected) or actual!=expected:
              raise SystemExit("BLOCKED: immutable Gateway candidate image mismatch")
          env={r.get("name"):r for r in containers[0].get("env") or []}
          if env.get("GEMINI_SHARED_EXECUTION_ENABLED",{}).get("value")!="true":
              raise SystemExit("BLOCKED: shared Gemini route is not enabled on this candidate")
          if env.get("GEMINI_SHARED_AUDIENCE",{}).get("value","").rstrip("/")!=os.environ["CAPACITY_AUDIENCE"]:
              raise SystemExit("BLOCKED: Gateway audience configuration drift")
          if env.get("GEMINI_SHARED_MODEL",{}).get("value")!="gemini-3.5-flash-lite" or (
              env.get("GEMINI_PAID_ENABLED",{}).get("value")=="true"):
              raise SystemExit("BLOCKED: model/billing guard unexpected")
          expected_callers={k:"omniagent-codex-"+suffix+"@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
             for k,suffix in (("omniagent","chat-client"),("market-mart","market-client"),("life-assistant","life-client"))}
          try: callers=json.loads(env["GEMINI_SHARED_CALLERS_JSON"]["value"])
          except (KeyError,TypeError,ValueError):raise SystemExit("BLOCKED: caller map missing")
          if callers!=expected_callers or not env.get("OMNIAGENT_PROVIDER_BUNDLE",{}).get("valueFrom"):
              raise SystemExit("BLOCKED: caller identity or provider Secret source mismatched")
          print("candidate_runtime_config=PASS_ONE_APPROVED_FLASH_LITE_ROUTE")
          PY
      - name: Market-mart only, one real 29,987-byte Gemini input; negative size checks without inference
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export CI_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,uuid
          from urllib.parse import quote
          url=os.environ["CAPACITY_PILOT_URL"]+"/v1/gemini/execute"
          audience=os.environ["CAPACITY_AUDIENCE"]
          project=os.environ["PROJECT"]
          access=os.environ["CI_ACCESS_TOKEN"]
          def mint(account):
              email="omniagent-codex-"+account+"@"+project+".iam.gserviceaccount.com"
              target="https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/"+quote(email,safe="")+":generateIdToken"
              req=urllib.request.Request(target,method="POST",
                  data=json.dumps({"audience":audience,"includeEmail":True}).encode(),
                  headers={"Authorization":"Bearer "+access,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=25) as res:
                  return json.load(res)["token"]
          market_token=mint("market-client")
          life_token=mint("life-client")
          def send(token,project_name,prompt):
              rid=str(uuid.uuid4())
              body={"project":project_name,"ownerId":"00000000-0000-4000-8000-000000000001",
                    "requestId":rid,"model":"gemini-3.5-flash-lite","prompt":prompt}
              # Default Python JSON encoding escapes CJK as backslash-u sequences:
              # this must be supported for Janus's complete CEO payload.
              encoded=json.dumps(body).encode()
              req=urllib.request.Request(url,method="POST",data=encoded,
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=85) as res:
                      return res.status,json.load(res),rid,len(encoded)
              except urllib.error.HTTPError as error:
                  return error.code,json.load(error),rid,len(encoded)
          anonymous=urllib.request.Request(url,method="POST",data=b"{}",
              headers={"Content-Type":"application/json"})
          try:
              urllib.request.urlopen(anonymous,timeout=25)
              raise SystemExit("BLOCKED: anonymous Gateway request unexpectedly passed")
          except urllib.error.HTTPError as e:
              if e.code not in (401,403):raise SystemExit("BLOCKED: anonymous Gateway denial unexpected")
          for token,label,text in ((market_token,"market-mart","x"*32769),
                                   (life_token,"life-assistant","x"*8193)):
              status,body,_,size=send(token,label,text)
              if status!=400 or body.get("error")!="invalid_request":
                  raise SystemExit("BLOCKED: caller prompt byte-limit denial failed")
          print("negative_boundary_market32K_plus1=PASS")
          print("negative_boundary_life8K_plus1=PASS")
          cjk="五"*9995+"OK"
          if len(cjk.encode("utf8"))!=29987:
              raise SystemExit("BLOCKED: synthetic CEO input size mismatch")
          status,body,request_id,wire_size=send(market_token,"market-mart",cjk)
          if wire_size<=49152 or wire_size>=131072:
              raise SystemExit("BLOCKED: escaped CJK JSON envelope not representative")
          if not (status==200 and body.get("status")=="completed" and
                  body.get("project")=="market-mart" and body.get("requestId")==request_id and
                  body.get("model")=="gemini-3.5-flash-lite" and
                  isinstance(body.get("result",{}).get("text"),str) and body["result"]["text"].strip()):
              error=body.get("error","unexpected") if isinstance(body,dict) else "unexpected"
              raise SystemExit("BLOCKED: 29,987-byte real Gemini result status="+str(status)+
                               " safe_error="+str(error)[:60])
          print("market_mart_ceo_prompt_utf8_bytes=29987")
          print("market_mart_json_wire_bytes="+str(wire_size))
          print("market_mart_ceo_capacity_real_roundtrip=PASS_NONEMPTY")
          print("market_mart_real_provider_calls=1")
          PY
      - name: Verify unchanged formal traffic after smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/gateway.json" || { echo "postcheck=NO_SNAPSHOT"; exit 0; }
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/final.json"
          python3 - "$RUNNER_TEMP/gateway.json" "$RUNNER_TEMP/final.json" <<'PY'
          import json,os,sys
          before,after=(json.load(open(p)) for p in sys.argv[1:3])
          def formal(x):
              return {e.get("revisionName"):e.get("percent") for e in (x.get("status") or {}).get("traffic") or [] if e.get("percent",0)>0}
          if formal(before)!=formal(after):
              raise SystemExit("BLOCKED: formal Gateway serving allocation changed")
          tag="ghcr-"+os.environ["SOURCE_SHA"][:12]
          rows=[e for e in (after.get("status") or {}).get("traffic") or [] if e.get("tag")==tag]
          if len(rows)!=1 or rows[0].get("percent",0)!=0:
              raise SystemExit("BLOCKED: tested Gateway candidate not retained at 0%")
          print("formal_gateway_traffic_unchanged=PASS")
          print("tested_zero_traffic_tag_retained=PASS")
          PY
