# Unified maintenance: diagnostics, inventory, retention, cleanup
name: Maintenance
on:
  schedule:
    - cron: '0 4 * * *'  # Daily 4am UTC
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        type: choice
        options: [all, inventory, retention, diagnostic]
        default: all

permissions:
  contents: read
  id-token: write

env:
  PROJECT: gen-lang-client-0593591102
  REGION: us-central1

jobs:
  inventory:
    if: inputs.task == 'all' || inputs.task == 'inventory' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Cloud Run inventory
        run: |
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            echo "=== $svc ===" >> "$GITHUB_STEP_SUMMARY"
            gcloud run revisions list --service="$svc" --project="$PROJECT" --region="$REGION" \
              --format="table(name,status.conditions[0].status,spec.containers[0].image)" >> "$GITHUB_STEP_SUMMARY"
          done

  retention:
    if: inputs.task == 'all' || inputs.task == 'retention' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Retain newest 10 revisions per service
        run: |
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            current=$(gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" \
              --format="value(status.latestReadyRevisionName)")
            python3 scripts/cloudrun_revision_retention.py --service "$svc" \
              --promoted-revision "$current" --rollback-revision "$current" --apply || true
          done

  diagnostic:
    if: inputs.task == 'all' || inputs.task == 'diagnostic' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Health check
        run: |
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            url=$(gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" --format="value(status.url)")
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url/health" || echo "000")
            echo "$svc: $status" >> "$GITHUB_STEP_SUMMARY"
          done
