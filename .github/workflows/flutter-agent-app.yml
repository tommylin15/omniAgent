name: Flutter Agent App

on:
  push:
    paths:
      - 'apps/agent_app/**'
      - '.github/workflows/flutter-agent-app.yml'
  pull_request:
    paths:
      - 'apps/agent_app/**'
      - '.github/workflows/flutter-agent-app.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build web
