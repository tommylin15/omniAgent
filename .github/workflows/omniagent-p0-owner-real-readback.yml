# One bounded audit for the Owner's real A reply, no new provider requests.
name: omniAgent P0 Owner real DB readback
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-p0-owner-db-evidence
  cancel-in-progress: false
jobs:
  readback:
    if: >-
      github.repository == 'tommylin15/omniAgent' &&
      contains(github.event.head_commit.message, '[p0-evidence-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable current main and read-only audit contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          bash -n infra/gcp/p0-owner-live-readback.sh
          python3 -m unittest discover -s tests -p test_p0_owner_live_readback.py -v
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Real PostgreSQL Owner events and trial budget readback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          status=0
          bash infra/gcp/p0-owner-live-readback.sh > "$RUNNER_TEMP/readback.txt" || status=$?
          grep '^p0_' "$RUNNER_TEMP/readback.txt" || :
          test "$status" -eq 0
          grep -qx 'p0_owner_db_readonly=PASS' "$RUNNER_TEMP/readback.txt"
          grep -qx 'p0_owner_text_and_terminal_persisted=PASS' "$RUNNER_TEMP/readback.txt"
          echo 'Owner A durable provider output: database audit PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner B live authenticated negative: NOT VERIFIED by this audit' >> "$GITHUB_STEP_SUMMARY"
      - name: Trial Chat API request metadata only (no prompts or identity)
        if: always()
        shell: bash
        env:
          PROJECT: gen-lang-client-0593591102
          REGION: us-central1
        run: |
          set -euo pipefail
          umask 077
          trial="p0-trial-effb7b08c8d5"
          gcloud run services describe omniagent-chat --project="$PROJECT" \
            --region="$REGION" --format=json > "$RUNNER_TEMP/trial-service.json"
          python3 - "$RUNNER_TEMP/trial-service.json" "$trial" "$RUNNER_TEMP/trial-revision.txt" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1])).get("status") or {}
          routes=status.get("traffic") or []
          matches=[r for r in routes if r.get("tag")==sys.argv[2] and r.get("percent",0)==0]
          if len(matches)!=1:
              print("p0_trial_route=NOT_VERIFIED")
              raise SystemExit(0)
          rev=str(matches[0].get("revisionName",""))
          if not rev.startswith("omniagent-chat-"):
              print("p0_trial_route=NOT_VERIFIED")
              raise SystemExit(0)
          open(sys.argv[3],"w").write(rev)
          print("p0_trial_route=ZERO_TRAFFIC_PRESENT")
          PY
          if test -s "$RUNNER_TEMP/trial-revision.txt"; then
            rev="$(cat "$RUNNER_TEMP/trial-revision.txt")"
            query="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"omniagent-chat\" AND resource.labels.revision_name=\"$rev\" AND timestamp>=\"2026-10-11T12:55:00Z\" AND httpRequest.requestMethod=\"POST\""
            if gcloud logging read "$query" --project="$PROJECT" --format=json --limit=150 > "$RUNNER_TEMP/trial-requests.json" 2> /dev/null; then
              python3 - "$RUNNER_TEMP/trial-requests.json" <<'PY'
          import json,sys
          from urllib.parse import urlsplit
          try: logs=json.load(open(sys.argv[1]))
          except Exception: logs=[]
          threads=messages=0
          for item in logs:
              req=item.get("httpRequest") or {}
              path=urlsplit(str(req.get("requestUrl",""))).path
              if path=="/v1/threads": threads+=1
              if path.startswith("/v1/threads/") and path.endswith("/messages"): messages+=1
          print("p0_trial_post_create_thread="+("PRESENT" if threads else "ZERO"))
          print("p0_trial_post_message="+("PRESENT" if messages else "ZERO"))
          print("p0_trial_request_log=READ_ONLY")
          PY
            else
              echo 'p0_trial_request_log=UNAVAILABLE_NO_ACCESS_OR_LOGS'
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-owner-db-evidence
          path: /home/runner/work/_temp/readback.txt
          if-no-files-found: warn
          retention-days: 90
