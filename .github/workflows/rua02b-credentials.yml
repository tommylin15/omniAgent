# RUA-02B phase 2: create scoped credentials and Secret Manager references.
# Does NOT modify shared pg_hba, the shared certificate, Cloud Run or traffic.
# One-shot fail closed if any target Secret already exists (no credential rotation).
name: RUA-02B isolated credentials
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rua02b-credentials.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-rua02b-credentials
  cancel-in-progress: false
jobs:
  credentials:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Strict existing schema and Secret preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          for name in omniagent-usage-writer-db omniagent-usage-reader-db omniagent-usage-ca-pem; do
            if gcloud secrets describe "$name" --project="$PROJECT" >/dev/null 2>&1; then
              echo "rua02b_existing_secret=BLOCKED_NO_CREDENTIAL_ROTATION"
              exit 2
            fi
          done
          gcloud run services describe omniagent-chat --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/chat.json"
          gcloud run services describe omniagent-agent-gateway --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/gateway.json"
          python3 - "$RUNNER_TEMP/chat.json" "$RUNNER_TEMP/gateway.json" "$RUNNER_TEMP/sa.tsv" <<'PY'
          import json,sys,re
          sas=[]
          for path in sys.argv[1:3]:
            o=json.load(open(path))
            sa=o['spec']['template']['spec']['serviceAccountName']
            if not re.fullmatch(r'[a-z0-9.-]+@gen-lang-client-0593591102\.iam\.gserviceaccount\.com',sa):
              raise SystemExit('rua02b_runtime_sa_mismatch')
            if len([x for x in o['status']['traffic'] if x.get('percent',0)>0]) != 1:
              raise SystemExit('rua02b_runtime_traffic_not_single_revision')
            sas.append(sa)
          with open(sys.argv[3],'w') as f: f.write('\n'.join(sas)+'\n')
          print('rua02b_scope_runtime_service_accounts=PASS')
          PY
          echo "rua02b_existing_secret_guard=PASS"
      - name: Securely derive existing omniAgent PostgreSQL endpoint without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/rua02b"
          mkdir -m 700 "$work"
          # Reads ONLY omniAgent's existing credential bundle; never echo payload.
          gcloud secrets versions access latest --secret=omniagent-bundle --project="$PROJECT" > "$work/omniagent-bundle.json"
          gcloud compute instances describe janus-postgres-dev --project="$PROJECT" --zone=us-central1-a --format=json > "$work/vm.json"
          python3 - "$work" <<'PY'
          import json,sys,ipaddress,secrets
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          d=Path(sys.argv[1])
          bundle=json.loads((d/'omniagent-bundle.json').read_text())
          raw=bundle.get('chat_database_url')
          if not isinstance(raw,str):raise SystemExit('rua02b_existing_chat_dsn_unavailable')
          u=urlsplit(raw)
          vm=json.loads((d/'vm.json').read_text())
          ni=vm['networkInterfaces'][0]
          valid={ni.get('networkIP')}
          valid.update(x.get('natIP') for x in ni.get('accessConfigs',[]))
          try:host=str(ipaddress.ip_address(u.hostname or ''))
          except ValueError:raise SystemExit('rua02b_unexpected_db_hostname')
          if (u.scheme not in ('postgres','postgresql') or
              unquote(u.username or '')!='omniagent_chat_app' or
              u.path!='/omniagent_chat' or host not in valid or
              (u.port or 5432)!=5432):
            raise SystemExit('rua02b_existing_chat_dsn_endpoint_mismatch')
          (d/'host').write_text(host)
          for role,secret in [('writer','omniagent_usage_writer'),('reader','omniagent_usage_reader')]:
            password=secrets.token_hex(32)
            (d/(role+'-password')).write_text(password)
            (d/(role+'-dsn')).write_text(
              f'postgresql://{secret}:{password}@{host}:5432/omniagent_gateway?sslmode=require')
          print('rua02b_existing_omniagent_endpoint_verified=PASS')
          PY
          rm -f "$work/omniagent-bundle.json"
      - name: Export and pin ONLY public certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/rua02b-public-cert.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          c=janus-postgres
          pg() { sudo docker exec -u postgres "$c" psql -X -A -t -v ON_ERROR_STOP=1 -d postgres -c "$1"; }
          [[ "$(pg 'SHOW ssl')" == "on" ]] || exit 3
          f="$(pg 'SHOW ssl_cert_file')"
          dir="$(pg 'SHOW data_directory')"
          [[ "$f" =~ ^[A-Za-z0-9_./-]+$ && "$dir" =~ ^/[A-Za-z0-9_./-]+$ ]] || exit 4
          [[ "$f" == /* ]] || f="$dir/$f"
          [[ "$f" == "$dir/"* ]] || exit 5
          sudo docker exec -u postgres "$c" cat "$f" > /tmp/rua02b-public-ca.pem
          chmod 600 /tmp/rua02b-public-ca.pem
          REMOTE
          sed -i 's/^          //' "$RUNNER_TEMP/rua02b-public-cert.sh"
          chmod 700 "$RUNNER_TEMP/rua02b-public-cert.sh"
          HOST=janus-postgres-dev
          gcloud compute scp "$RUNNER_TEMP/rua02b-public-cert.sh" "$HOST:/tmp/rua02b-public-cert.sh" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet >/dev/null
          gcloud compute ssh "$HOST" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo bash /tmp/rua02b-public-cert.sh" >/dev/null
          # The artifact is a public certificate, NEVER a private key.
          gcloud compute scp "$HOST:/tmp/rua02b-public-ca.pem" "$RUNNER_TEMP/rua02b/public-ca.pem" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet >/dev/null
          gcloud compute ssh "$HOST" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo rm -f /tmp/rua02b-public-ca.pem /tmp/rua02b-public-cert.sh" >/dev/null
          test "$(openssl x509 -in "$RUNNER_TEMP/rua02b/public-ca.pem" -noout -fingerprint -sha256 | sed 's/^.*=//')" = '5F:16:D1:58:31:AA:50:FA:4A:EF:09:08:7F:1A:70:5D:96:DA:90:CF:23:3C:FF:AE:16:7B:D7:CD:E9:47:25:56'
          openssl x509 -in "$RUNNER_TEMP/rua02b/public-ca.pem" -noout -checkhost janus-postgres-dev | grep -q 'does match'
          echo "rua02b_public_cert_pinned=PASS"
      - name: Create strictly scoped secrets and service-level readers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/rua02b"
          # First create all three secrets; fail closed on missing IAM.
          for name in omniagent-usage-writer-db omniagent-usage-reader-db omniagent-usage-ca-pem; do
            gcloud secrets create "$name" --project="$PROJECT" --replication-policy=user-managed --locations="$REGION" --quiet >/dev/null
          done
          gcloud secrets versions add omniagent-usage-writer-db --project="$PROJECT" --data-file="$work/writer-dsn" >/dev/null
          gcloud secrets versions add omniagent-usage-reader-db --project="$PROJECT" --data-file="$work/reader-dsn" >/dev/null
          gcloud secrets versions add omniagent-usage-ca-pem --project="$PROJECT" --data-file="$work/public-ca.pem" >/dev/null
          chat_sa="$(sed -n '1p' "$RUNNER_TEMP/sa.tsv")"
          gateway_sa="$(sed -n '2p' "$RUNNER_TEMP/sa.tsv")"
          gcloud secrets add-iam-policy-binding omniagent-usage-reader-db --project="$PROJECT" \
            --member="serviceAccount:$chat_sa" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
          gcloud secrets add-iam-policy-binding omniagent-usage-writer-db --project="$PROJECT" \
            --member="serviceAccount:$gateway_sa" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
          for sa in "$chat_sa" "$gateway_sa"; do
            gcloud secrets add-iam-policy-binding omniagent-usage-ca-pem --project="$PROJECT" \
              --member="serviceAccount:$sa" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
          done
          echo "rua02b_secret_creation_and_runtime_iam=PASS"
      - name: Activate ONLY the two NOLOGIN omniAgent DB roles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/rua02b"
          cat > "$RUNNER_TEMP/rua02b-enable-roles.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          C=janus-postgres
          trap 'rm -f /tmp/rua02b-enable-roles.sh /tmp/rua02b-writer-password /tmp/rua02b-reader-password' EXIT
          pg() { sudo docker exec -u postgres "$C" psql -X -A -t -v ON_ERROR_STOP=1 -d postgres -c "$1"; }
          [[ "$(pg 'SHOW ssl')" == "on" ]] || exit 3
          [[ "$(pg "SELECT count(*) FROM pg_database WHERE datname='omniagent_gateway'")" == 1 ]] || exit 4
          for role in omniagent_usage_writer omniagent_usage_reader; do
            [[ "$(pg "SELECT rolcanlogin::text || ':' || rolsuper::text || ':' || rolcreatedb::text || ':' || rolcreaterole::text FROM pg_roles WHERE rolname='$role'")" == 'false:false:false:false' ]] || exit 5
          done
          [[ "$(sudo docker exec -u postgres "$C" psql -X -A -t -v ON_ERROR_STOP=1 -d omniagent_gateway -c "SELECT count(*) FROM omni_gateway.router_usage_events")" == 0 ]] || exit 6
          for role in writer reader; do
            password="$(cat "/tmp/rua02b-$role-password")"
            [[ "$password" =~ ^[a-f0-9]{64}$ ]] || exit 7
            printf "ALTER ROLE omniagent_usage_%s LOGIN PASSWORD '%s';\n" "$role" "$password" |
              sudo docker exec -i -u postgres "$C" psql -X -q -v ON_ERROR_STOP=1 -d postgres >/dev/null
          done
          for role in omniagent_usage_writer omniagent_usage_reader; do
            [[ "$(pg "SELECT rolcanlogin::text || ':' || rolsuper::text || ':' || rolcreatedb::text || ':' || rolcreaterole::text FROM pg_roles WHERE rolname='$role'")" == 'true:false:false:false' ]] || exit 8
          done
          echo 'rua02b_dedicated_role_logins=PASS'
          echo 'rua02b_hba_network=NOT_CONFIGURED'
          echo 'rua02b_cloud_run_telemetry=NOT_CONFIGURED'
          REMOTE
          sed -i 's/^          //' "$RUNNER_TEMP/rua02b-enable-roles.sh"
          chmod 700 "$RUNNER_TEMP/rua02b-enable-roles.sh"
          HOST=janus-postgres-dev
          gcloud compute scp "$RUNNER_TEMP/rua02b-enable-roles.sh" "$HOST:/tmp/rua02b-enable-roles.sh" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet >/dev/null
          gcloud compute scp "$work/writer-password" "$HOST:/tmp/rua02b-writer-password" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet >/dev/null
          gcloud compute scp "$work/reader-password" "$HOST:/tmp/rua02b-reader-password" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet >/dev/null
          gcloud compute ssh "$HOST" --project="$PROJECT" --zone=us-central1-a --tunnel-through-iap --quiet \
            --command="sudo chmod 600 /tmp/rua02b-*-password; sudo bash /tmp/rua02b-enable-roles.sh; rc=\$?; sudo rm -f /tmp/rua02b-enable-roles.sh /tmp/rua02b-*-password; exit \$rc"
          # Remove sensitive local working files on success.
          rm -f "$work/writer-password" "$work/reader-password" "$work/writer-dsn" "$work/reader-dsn"
