name: omniAgent PostgreSQL readiness diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-postgres-readiness-diagnostic.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_ZONE: us-central1-a
  OMNIAGENT_GCP_WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  OMNIAGENT_GCP_CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.OMNIAGENT_GCP_WIF_PROVIDER }}
          service_account: ${{ env.OMNIAGENT_GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read PostgreSQL recent connection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          vm="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          container="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          gcloud compute ssh "$vm" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" \
            --tunnel-through-iap --quiet \
            --command="echo RECENT_LOGS; sudo docker logs --since 15m '$container' 2>&1 | tail -n 120; \
              echo ACTIVE; sudo docker exec -u postgres '$container' psql -Atqc \"SELECT usename,datname,client_addr,state FROM pg_stat_activity WHERE usename='omniagent_chat_app';\"; \
              echo HBA; sudo docker exec -u postgres '$container' psql -Atqc \"SELECT rule_number,type,database,user_name,address,auth_method,error FROM pg_hba_file_rules WHERE database @> ARRAY['omniagent_chat'] OR user_name @> ARRAY['omniagent_chat_app'];\""
