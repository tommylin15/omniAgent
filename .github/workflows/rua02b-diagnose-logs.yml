# RUA-02B: read-only, narrow structured log evidence on the specific 0% candidate.
name: RUA-02B telemetry failure diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rua02b-diagnose-logs.yml']
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare real Gateway subnet and dedicated DB hostssl reachability scope
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute networks subnets describe janusai-lake-poc-uscentral1 --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/subnet.json"
          gcloud compute ssh janus-postgres-dev --project=gen-lang-client-0593591102 --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo docker exec -u postgres janus-postgres psql -X -A -F '|' -t -v ON_ERROR_STOP=1 -d postgres -c \"SELECT address,netmask FROM pg_hba_file_rules WHERE type='hostssl' AND database @> ARRAY['omniagent_gateway'] AND user_name @> ARRAY['omniagent_usage_writer'] AND error IS NULL\"" > "$RUNNER_TEMP/hba.txt"
          python3 - "$RUNNER_TEMP/subnet.json" "$RUNNER_TEMP/hba.txt" <<'PY'
          import json,ipaddress,sys
          subnet=ipaddress.ip_network(json.load(open(sys.argv[1]))['ipCidrRange'],strict=False)
          networks=[]
          for line in open(sys.argv[2]):
              parts=line.strip().split('|')
              if len(parts)!=2:continue
              try:
                  if parts[1]:
                      n=ipaddress.ip_network(parts[0]+'/'+parts[1],strict=False)
                  else:
                      n=ipaddress.ip_network(parts[0],strict=False)
                  networks.append(n)
              except ValueError:continue
          print('rua02b_direct_vpc_subnet='+str(subnet))
          print('rua02b_scoped_writer_hba_count='+str(len(networks)))
          print('rua02b_writer_hba_accepts_gateway_subnet='+str(any(subnet.subnet_of(net) for net in networks)).upper())
          PY
      - name: Read only bounded Gateway usage-capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="omniagent-agent-gateway" AND resource.labels.revision_name="omniagent-agent-gateway-00107-doy"' \
            --project=gen-lang-client-0593591102 --freshness=2h --limit=100 --format=json > "$RUNNER_TEMP/logs.json" 2>/dev/null || { echo 'rua02b_logging_read=PERMISSION_DENIED'; echo '[]' > "$RUNNER_TEMP/logs.json"; }
          python3 - "$RUNNER_TEMP/logs.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          counts={}
          for row in rows:
              payload=row.get('jsonPayload') or {}
              text=row.get('textPayload') or ''
              if not payload and isinstance(text,str) and text.startswith('{'):
                  try:payload=json.loads(text)
                  except ValueError:payload={}
              kind=payload.get('kind')
              if kind not in ('gateway_usage_capture','shared_gemini_call'):
                  continue
              status=payload.get('state',payload.get('status','other'))
              project=payload.get('project','unknown')
              if project not in ('life-assistant','market-mart','omniagent'):project='unknown'
              if status not in ('deferred','unavailable','completed','failed'):status='other'
              key=(kind,project,status)
              counts[key]=counts.get(key,0)+1
          for (kind,project,status),count in sorted(counts.items()):
              print('rua02b_log='+kind+':'+project+':'+status+':'+str(count))
          print('rua02b_log_entries_examined='+str(len(rows)))
          print('rua02b_logs_have_capture_signal='+str(any(k[0]=='gateway_usage_capture' for k in counts)).upper())
          PY
