name: omniAgent Gateway candidate config diff read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-gateway-candidate-config-diff.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.repository == 'tommylin15/omniAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect revision environment shapes without exposing any value
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          P=gen-lang-client-0593591102
          R=us-central1
          S=omniagent-agent-gateway
          gcloud run services describe "$S" --project="$P" --region="$R" --format=json > "$RUNNER_TEMP/gateway.json"
          gcloud run revisions list --service="$S" --project="$P" --region="$R" --format=json > "$RUNNER_TEMP/revisions.json"
          python3 - "$RUNNER_TEMP/gateway.json" "$RUNNER_TEMP/revisions.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          service,revisions=(json.load(open(x)) for x in sys.argv[1:3])
          if not isinstance(revisions,list): raise SystemExit("BLOCKED: revision list unavailable")
          revisions.sort(key=lambda x:(x.get("metadata") or {}).get("creationTimestamp",""),reverse=True)
          names=[(r.get("metadata") or {}).get("name","") for r in revisions[:4]]
          # Cloud Run service template is the current candidate specification.
          def spec(doc,is_service):
              return (((doc.get("spec") or {}).get("template") or {}).get("spec") or {}) if is_service else (doc.get("spec") or {})
          def shape(doc,is_service):
              s=spec(doc,is_service)
              c=s.get("containers") or []
              if len(c)!=1: raise SystemExit("BLOCKED: invalid container count")
              env=c[0].get("env") or []
              if any(not isinstance(row.get("name"),str) for row in env):
                  raise SystemExit("BLOCKED: invalid env")
              keys=[row["name"] for row in env]
              return keys,{row["name"]:row for row in env},s.get("serviceAccountName"),s.get("vpcAccess")
          service_keys,service_env,sa,vpc=shape(service,True)
          print("gateway_revision_count="+str(len(revisions)))
          print("gateway_latest_template_env_keys="+",".join(sorted(service_keys)))
          print("gateway_latest_template_identity="+("CONFIGURED" if sa else "MISSING"))
          print("gateway_latest_template_vpc="+("CONFIGURED" if vpc else "MISSING"))
          # Most recent 2 revisions; report only field names, no secret payloads.
          for item in revisions[:2]:
              rk,renv,rsa,rvpc=shape(item,False)
              name=(item.get("metadata") or {}).get("name","")
              print("gateway_revision="+name)
              print("  environment_keys="+",".join(sorted(rk)))
              print("  runtime_identity_matches_current="+str(rsa==sa))
              print("  vpc_matches_current="+str(rvpc==vpc))
              print("  environment_key_set_matches_current="+str(set(rk)==set(service_keys)))
              print("  environment_order_matches_current="+str(rk==service_keys))
              print("  environment_value_matches_current="+str(renv==service_env))
              print("  changed_names="+",".join(sorted(k for k in set(renv)|set(service_env) if renv.get(k)!=service_env.get(k))))
          PY
          echo "runtime_read_only=PASS" >> "$GITHUB_STEP_SUMMARY"
