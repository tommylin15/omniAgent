# New GitHub Actions -> public GHCR -> Cloud Run only. Read-only readiness
# for a GHCR-based fallback; never depend on legacy AR or Cloud Build rollback.
name: omniAgent GHCR new-only rollback preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-new-only-rollback-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify exact GHCR primary and new-only fallback without touching traffic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" \
              --format=json > "$RUNNER_TEMP/$svc-svc.json"
          done
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          project=os.environ["PROJECT"]
          region=os.environ["REGION"]
          primary_sha="f9a4a7b5d4d226d47af6aa526d49d10737b44406"
          fallback_sha="f2a5be4425953b26f2340694765362c7bdc943c9"
          versions={
            "omniagent-chat":(
              ("omniagent-chat-00038-yog","a719bae4711a750f7dfcd6c59b206c700195639f02df752094959be36a288751"),
              ("omniagent-chat-00037-duj","74f0c8b2067fd598a84bdae7b1aa43ea463bd6ecc6d6f7886e369c65b43d4eb8")),
            "omniagent-agent-gateway":(
              ("omniagent-agent-gateway-00029-ter","a022e22c50aca2337aa1f8f364c7d8d51a1d992e839c63cde16ed77d6ad00b83"),
              ("omniagent-agent-gateway-00028-rof","75baf42ae3efba134eca4eda440059dc220e63c927c3d3bb6a87089dce7db112")),
            "omniagent-shared-codex":(
              ("omniagent-shared-codex-00018-poq","ba09ea33d4c0f23751b847e896df3154384b3c26395a65d3138db094529a6321"),
              ("omniagent-shared-codex-00017-lob","805346261e79b232b8e68a2701251707f718d64b2adc54dc96815a85b934b93f")),
          }
          failed=[]
          for service, pair in versions.items():
              document=json.loads((root/(service+"-svc.json")).read_text())
              status=document.get("status") or {}
              rows=status.get("traffic") or []
              live=[r for r in rows if r.get("percent",0)>0]
              if len(live)!=1 or live[0].get("percent")!=100:
                  failed.append(service+":TRAFFIC_SPLIT_OR_UNVERIFIED")
              for i,((revision,digest),sha) in enumerate(zip(pair,(primary_sha,fallback_sha))):
                  tag="ghcr-"+sha[:12]
                  tags=[r for r in rows if r.get("revisionName")==revision and
                        r.get("tag")==tag and r.get("percent",0)==0]
                  if len(tags)!=1:
                      failed.append(service+":"+( "PRIMARY" if i==0 else "FALLBACK")+":TAG_MISSING")
                  args=["gcloud","run","revisions","describe",revision,
                    "--project="+project,"--region="+region,"--format=json"]
                  result=subprocess.run(args,capture_output=True,text=True,timeout=35,check=False)
                  if result.returncode:
                      failed.append(service+":REVISION_READ_FAILED")
                      continue
                  rev=json.loads(result.stdout)
                  cond={c.get("type"):c.get("status") for c in (rev.get("status") or {}).get("conditions") or []}
                  images=[str(c.get("image","")) for c in (rev.get("spec") or {}).get("containers") or []]
                  digest_ok=(len(images)==1 and images[0].endswith("@sha256:"+digest)
                      and (images[0].startswith("ghcr.io/tommylin15/") or ".pkg.dev/" in images[0]))
                  if cond.get("Ready")!="True" or not digest_ok:
                      failed.append(service+":REVISION_READINESS_OR_DIGEST")
                  refstates=[]
                  for container in (rev.get("spec") or {}).get("containers") or []:
                      for entry in container.get("env") or []:
                          ref=(entry.get("valueFrom") or {}).get("secretKeyRef") or {}
                          if not ref:
                              continue
                          name=str(ref.get("name",""))
                          key=str(ref.get("key",""))
                          if not re.fullmatch(r"[A-Za-z0-9_-]{1,255}",name) or not re.fullmatch(r"(latest|[0-9]+)",key):
                              failed.append(service+":BAD_SECRET_REFERENCE")
                              continue
                          cp=subprocess.run(["gcloud","secrets","versions","describe",key,
                           "--secret="+name,"--project="+project,"--format=value(state)"],
                           text=True,capture_output=True,timeout=25)
                          state=cp.stdout.strip().upper() if cp.returncode==0 else "UNVERIFIED"
                          refstates.append({"env":entry.get("name"),"version":key,"state":state})
                          if state!="ENABLED":
                              failed.append(service+":FALLBACK_OR_PRIMARY_SECRET_NOT_ENABLED")
                  print(json.dumps({"service":service,"role":"primary" if i==0 else "new_ghcr_fallback",
                      "revision":revision,"sha":sha,"tag_attached":len(tags)==1,
                      "ready":cond.get("Ready")=="True","digest_verified":digest_ok,
                      "secret_version_states":refstates},sort_keys=True))
          if failed:
              print("new_only_rollback_readiness=BLOCKED")
              print("block_categories="+",".join(sorted(set(failed))))
              raise SystemExit(1)
          print("new_only_rollback_readiness=PASS")
          print("legacy_rollback_dependency=NONE")
          print("production_traffic_mutated=NO")
          print("live_browser_and_full_provider_acceptance=NOT_VERIFIED")
          PY
