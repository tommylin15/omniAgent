name: omniAgent Gemini 503 availability bounded smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-gemini503-availability-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      SOURCE_SHA: 00d45861c78c60b005cab93a0a164804d555923e
      SERVICE: omniagent-agent-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read back immutable zero-traffic Gemini candidate and private market identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          python3 - "$RUNNER_TEMP/service.json" "$RUNNER_TEMP/iam.json" "$GITHUB_ENV" <<'PY'
          import json,os,sys,re
          svc,iam=(json.load(open(x)) for x in sys.argv[1:3])
          tag="p0v-market2048-"+os.environ["SOURCE_SHA"][:8]
          routes=(svc.get("status") or {}).get("traffic") or []
          rows=[x for x in routes if x.get("tag")==tag and x.get("percent",0)==0]
          prod=[x for x in routes if x.get("percent",0)>0]
          if len(rows)!=1 or len(prod)!=1 or prod[0].get("percent")!=100:
              raise SystemExit("BLOCKED: candidate tag or production routing drift")
          canonical=(svc.get("status") or {}).get("url","").rstrip("/")
          tagged=rows[0].get("url","").rstrip("/")
          if not re.fullmatch(r"https://omniagent-agent-gateway-[a-z0-9-]+\.a\.run\.app",canonical) or not tagged.startswith("https://"+tag+"---omniagent-agent-gateway-"):
              raise SystemExit("BLOCKED: URL or audience drift")
          members={m for b in iam.get("bindings") or [] if b.get("role")=="roles/run.invoker"
                   for m in b.get("members") or []}
          caller="serviceAccount:omniagent-codex-market-client@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
          if caller not in members or "allUsers" in members or "allAuthenticatedUsers" in members:
              raise SystemExit("BLOCKED: Gateway private IAM or market identity changed")
          with open(sys.argv[3],"a") as f:
              f.write("PROBE_URL="+tagged+"/v1/gemini/execute\n")
              f.write("PROBE_AUDIENCE="+canonical+"\n")
              f.write("PROBE_REV="+rows[0]["revisionName"]+"\n")
          print("private_market_mart_identity=PASS")
          print("provider_candidate_zero_traffic=PASS")
          PY
      - name: Verify ready private Gemini pilot after env propagation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run revisions describe "$PROBE_REV" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/rev.json"
          python3 - "$RUNNER_TEMP/rev.json" <<'PY'
          import json,sys
          rev=json.load(open(sys.argv[1]))
          cond=(rev.get("status") or {}).get("conditions") or []
          if not any(x.get("type")=="Ready" and x.get("status")=="True" for x in cond):
              raise SystemExit("BLOCKED: candidate not ready")
          env={x.get("name"):x for c in (rev.get("spec") or {}).get("containers") or [] for x in c.get("env") or []}
          if env.get("GEMINI_SHARED_EXECUTION_ENABLED",{}).get("value")!="true" or env.get("GEMINI_SHARED_MODEL",{}).get("value")!="gemini-3.5-flash-lite":
              raise SystemExit("BLOCKED: candidate Gemini config differs")
          if env.get("GEMINI_PAID_ENABLED",{}).get("value")=="true":
              raise SystemExit("BLOCKED: paid flag changed")
          print("private_candidate_runtime_ready=PASS")
          PY
      - name: One bounded live Gemini call, classify 503 without automatic retry
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export CI_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,uuid
          from urllib.parse import quote
          sa="omniagent-codex-market-client@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
          target="https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/"+quote(sa,safe="")+":generateIdToken"
          req=urllib.request.Request(target,method="POST",
            data=json.dumps({"audience":os.environ["PROBE_AUDIENCE"],"includeEmail":True}).encode(),
            headers={"Authorization":"Bearer "+os.environ["CI_ACCESS_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response:
              token=json.load(response)["token"]
          rid=str(uuid.uuid4())
          payload={"project":"market-mart","ownerId":"00000000-0000-4000-8000-000000000001",
                   "requestId":rid,"prompt":"Reply exactly OK.","model":"gemini-3.5-flash-lite"}
          request=urllib.request.Request(os.environ["PROBE_URL"],method="POST",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(request,timeout=75) as res:
                  status=res.status
                  body=json.load(res)
          except urllib.error.HTTPError as exc:
              status=exc.code
              try:body=json.load(exc)
              except ValueError:body={}
          print("provider_calls_attempted=1")
          print("gemini_gateway_http_status="+str(status))
          if status==200 and body.get("status")=="completed" and body.get("requestId")==rid and body.get("model")=="gemini-3.5-flash-lite" and isinstance(body.get("result",{}).get("text"),str) and body["result"]["text"].strip():
              print("gemini_upstream_current_availability=PASS_ONE_SHORT_CALL")
          elif status==503 and body.get("error")=="gemini_execution_failed" and body.get("reason")=="provider_unavailable" and body.get("upstreamStatus")==503 and body.get("transient") is True:
              print("gemini_503_classification=PASS")
              raise SystemExit("gemini_upstream_current_availability=UNAVAILABLE_RETRY_NOT_PERFORMED")
          else:
              safe_reason=body.get("reason","unknown") if isinstance(body,dict) else "unknown"
              print("gemini_failure_reason="+str(safe_reason)[:40])
              raise SystemExit("gemini_upstream_current_availability=NOT_CONFIRMED")
          PY
      - name: Verify formal traffic unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/service.json" || { echo "formal_traffic_readback=NOT_VERIFIED"; exit 0; }
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/after.json"
          python3 - "$RUNNER_TEMP/service.json" "$RUNNER_TEMP/after.json" <<'PY'
          import json,sys
          before,after=(json.load(open(x)) for x in sys.argv[1:3])
          formal=lambda svc:{x.get("revisionName"):x.get("percent") for x in (svc.get("status") or {}).get("traffic") or [] if x.get("percent",0)>0}
          if formal(before)!=formal(after):
              raise SystemExit("BLOCKED: Gateway serving traffic changed")
          print("formal_traffic_unchanged=PASS")
          PY
