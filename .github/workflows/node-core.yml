name: omniAgent Node Core

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'cloudbuild*.yaml'
      - 'infra/gcp/cicd_v2.py'
      - 'infra/gcp/live_acceptance_v2.py'
      - 'infra/postgres/migrations/**'
      - 'setup-omniagent-db-dev.sh'
      - '.github/workflows/node-core.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'cloudbuild*.yaml'
      - 'infra/gcp/cicd_v2.py'
      - 'infra/gcp/live_acceptance_v2.py'
      - 'infra/postgres/migrations/**'
      - 'setup-omniagent-db-dev.sh'
      - '.github/workflows/node-core.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate DB setup script syntax
        run: bash -n setup-omniagent-db-dev.sh
      - name: CI/CD V2 Python syntax and release safety
        run: |
          python3 -m py_compile infra/gcp/cicd_v2.py infra/gcp/live_acceptance_v2.py
          python3 -m unittest discover -s tests -p test_cicd_v2.py -v
