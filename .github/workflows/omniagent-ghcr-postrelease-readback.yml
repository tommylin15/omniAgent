# One-time read-only GCP evidence for already-applied GHCR production traffic.
# Triggered by this new workflow file only: no traffic mutation / provider calls.
name: omniAgent GHCR postrelease read-only traffic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-postrelease-readback.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-ghcr-postrelease-readonly
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      ACCEPTED_PROMOTION_SHA: 02ef7f682ed16e6bb4f0f57507bad4b88b8f02c2
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify actual 100% formal traffic, immutable digest, disabled provider flags
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for service in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$service" --project="$PROJECT" --region="$REGION"               --format=json > "$RUNNER_TEMP/$service.service.json"
          done
          gcloud run revisions describe omniagent-chat-00063-zis --project="$PROJECT"             --region="$REGION" --format=json > "$RUNNER_TEMP/omniagent-chat.revision.json"
          gcloud run revisions describe omniagent-agent-gateway-00054-met --project="$PROJECT"             --region="$REGION" --format=json > "$RUNNER_TEMP/omniagent-agent-gateway.revision.json"
          gcloud run revisions describe omniagent-shared-codex-00040-pon --project="$PROJECT"             --region="$REGION" --format=json > "$RUNNER_TEMP/omniagent-shared-codex.revision.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,os,sys,re
          from pathlib import Path
          root=Path(sys.argv[1])
          expected={
            "omniagent-chat":("omniagent-chat-00063-zis","sha256:de26528c8c100396eefc5107e2b023ae33207f0c6331d2e0a1b1c9784ad5c843"),
            "omniagent-agent-gateway":("omniagent-agent-gateway-00054-met","sha256:91f88f59851f7eb5dafac2884fc27a856eea2f30a43634829ce8465026582c4f"),
            "omniagent-shared-codex":("omniagent-shared-codex-00040-pon","sha256:9b0f777f09a2598dcf9025faf4bd33b0630c42284614c7ab86932dbb8089f863")
          }
          for service,(revision,digest) in expected.items():
              doc=json.loads((root/(service+".service.json")).read_text())
              rev=json.loads((root/(service+".revision.json")).read_text())
              routes=(doc.get("status") or {}).get("traffic") or []
              active=[r for r in routes if r.get("percent",0)>0]
              if len(active)!=1 or active[0].get("revisionName")!=revision or active[0].get("percent")!=100:
                  raise SystemExit(service+": formal_traffic_readback_BLOCKED")
              containers=(rev.get("spec") or {}).get("containers") or []
              if len(containers)!=1 or not str(containers[0].get("image","")).endswith("@"+digest):
                  raise SystemExit(service+": promoted_revision_digest_BLOCKED")
              conditions=(rev.get("status") or {}).get("conditions") or []
              if not any(c.get("type")=="Ready" and c.get("status")=="True" for c in conditions):
                  raise SystemExit(service+": promoted_revision_ready_BLOCKED")
              env={x.get("name"):x for x in containers[0].get("env") or []}
              if service=="omniagent-chat":
                  for flag in ("CHAT_DISPATCH_ENABLED","CHAT_BYOK_MANAGEMENT_ENABLED"):
                      if (env.get(flag) or {}).get("value")=="true" or (env.get(flag) or {}).get("valueFrom"):
                          raise SystemExit("chat_unapproved_provider_enablement_BLOCKED")
                  if any(key in env for key in ("CHAT_DISPATCH_APPROVED_OWNER_IDS",
                      "CHAT_DISPATCH_ENTITLEMENTS_JSON","CHAT_GATEWAY_URL","CHAT_GATEWAY_AUDIENCE")):
                      raise SystemExit("chat_owner_trial_configuration_leaked_BLOCKED")
              if service=="omniagent-agent-gateway" and (
                      "CODEX_CHAT_TRIAL_OWNER_SECRETS" in env):
                  raise SystemExit("gateway_owner_trial_secret_mapping_leaked_BLOCKED")
              print("formal_traffic_100_percent_"+service+"=PASS")
              print("immutable_ready_"+service+"=PASS")
          print("manual_oauth_gate=NOT_REQUIRED")
          print("production_dispatch_and_byok=DISABLED")
          print("postrelease_traffic_readback=PASS")
          print("revision_retention=NOT_YET_ACCEPTED_SEPARATE_GATE")
          PY
          {
            echo '### Existing GHCR production promotion: independent read-only confirmation'
            echo 'Source promotion: 02ef7f682ed16e6bb4f0f57507bad4b88b8f02c2'
            echo 'Actual production 100% traffic and promoted image digests verified.'
            echo 'Chat dispatch/BYOK remain disabled; manual OAuth gate NOT_REQUIRED.'
            echo 'Retention and Owner provider persistence remain separate OPEN gates.'
          } >> "$GITHUB_STEP_SUMMARY"
