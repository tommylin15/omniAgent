# Read-only positive/negative authorization and runtime smoke tests for verified
# 0% GHCR candidates. Provider execution deliberately NOT included in this
# workflow: no new user records, no credential rotation, no traffic changes.
name: omniAgent GHCR candidate signed smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-candidate-signed-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: gen-lang-client-0593591102
  REGION: us-central1
  TAG: ghcr-c37f132619da

jobs:
  chat-web:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Browser assets, readiness and unauthorized Chat API
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe omniagent-chat --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/chat.json"
          gcloud run revisions describe omniagent-chat-00028-ziw --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/chat-revision.json"
          python3 - "$RUNNER_TEMP/chat-revision.json" <<'PY'
          import json,sys
          revision=json.load(open(sys.argv[1]))
          containers=(revision.get("spec") or {}).get("containers") or []
          env=(containers[0].get("env") or []) if containers else []
          flags=[row for row in env if row.get("name")=="CHAT_DISPATCH_ENABLED"]
          if any(row.get("value")=="true" or row.get("valueFrom") for row in flags):
              raise SystemExit("BLOCKED: Chat dispatcher unexpectedly enabled")
          print("chat_candidate_dispatch_default_disabled=PASS")
          PY
          python3 - "$RUNNER_TEMP/chat.json" <<'PY'
          import json,sys,urllib.request,urllib.error
          s=json.load(open(sys.argv[1])); routes=s.get("status",{}).get("traffic",[])
          targets=[t for t in routes if t.get("tag")=="ghcr-c37f132619da"
                   and t.get("revisionName")=="omniagent-chat-00028-ziw" and t.get("percent",0)==0]
          if len(targets)!=1: raise SystemExit("BLOCKED: Chat candidate identity/tag/traffic changed")
          origin=targets[0].get("url","").rstrip("/")
          if not origin.startswith("https://"): raise SystemExit("BLOCKED: invalid candidate url")
          cases=(("/health",200),("/ready",200),("/",200),
                 ("/flutter_bootstrap.js",200),("/main.dart.js",200),
                 ("/v1/threads",401))
          good=True
          for path,expected in cases:
              req=urllib.request.Request(origin+path,headers={"User-Agent":"omniagent-live-smoke/1"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: actual=response.status
              except urllib.error.HTTPError as e: actual=e.code
              except Exception: actual="UNREACHABLE"
              print(json.dumps({"target":"chat-candidate","route":path,
                               "expected":expected,"observed":actual,
                               "pass":actual==expected},sort_keys=True))
              good &= actual==expected
          # Unauthenticated negative test: no claim and no provider invocation.
          path="/internal/v1/chat/dispatch:once"
          req=urllib.request.Request(origin+path,data=b"{}",
              headers={"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=30) as resp: actual=resp.status
          except urllib.error.HTTPError as e: actual=e.code
          except Exception: actual="UNREACHABLE"
          print(json.dumps({"target":"chat-candidate","route":path,"method":"POST",
                            "expected":401,"observed":actual,"pass":actual==401},sort_keys=True))
          good &= actual==401
          if not good: raise SystemExit("BLOCKED: Chat browser/protected-route smoke is not accepted")
          print("chat_browser_assets_and_api_auth_smoke=PASS")
          PY
  private-invocation:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: omniagent-agent-gateway
            revision: omniagent-agent-gateway-00019-sim
            caller: omniagent-chat
          - service: omniagent-shared-codex
            revision: omniagent-shared-codex-00012-gej
            caller: omniagent-codex-chat-client
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove tagged URL and service-level protection
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ matrix.revision }}
          CALLER: ${{ matrix.caller }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/service.json"
          python3 - "$RUNNER_TEMP/service.json" "$SERVICE" "$REVISION" "$TAG" > "$RUNNER_TEMP/urls.tsv" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          status=s.get("status",{})
          active=[t for t in status.get("traffic",[]) if t.get("percent",0)>0]
          tags=[t for t in status.get("traffic",[]) if t.get("revisionName")==sys.argv[3]
                and t.get("tag")==sys.argv[4] and t.get("percent",0)==0]
          if len(active)!=1 or active[0].get("percent")!=100 or len(tags)!=1:
              raise SystemExit("BLOCKED: unexpected live traffic or missing zero-percent candidate")
          url=tags[0].get("url","").rstrip("/")
          audience=status.get("url","").rstrip("/")
          if not (url.startswith("https://") and audience.startswith("https://")):
              raise SystemExit("BLOCKED: unusable private candidate URLs")
          print(url+"\t"+audience)
          PY
          IFS=$'\t' read -r URL AUDIENCE < "$RUNNER_TEMP/urls.tsv"
          test -n "$URL" && test -n "$AUDIENCE"
          # IAM Credentials generateIdToken needs only getOpenIdToken on this
          # dedicated target, NOT getAccessToken / full TokenCreator.
          # Never print access/identity tokens or error response bodies.
          export SERVICE_ACCOUNT="$CALLER@$PROJECT.iam.gserviceaccount.com"
          export ID_AUDIENCE="$AUDIENCE"
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          if ! python3 - "$RUNNER_TEMP/identity-token" <<'PY'
          import json,os,sys,urllib.request,urllib.error
          from urllib.parse import quote
          url=("https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/"
               +quote(os.environ["SERVICE_ACCOUNT"],safe="")+":generateIdToken")
          req=urllib.request.Request(url,
              data=json.dumps({"audience":os.environ["ID_AUDIENCE"],"includeEmail":True}).encode(),
              headers={"Authorization":"Bearer "+os.environ["ACCESS_TOKEN"],
                       "Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  token=json.load(response).get("token")
              if not isinstance(token,str) or not token:
                  raise ValueError("no token")
              with open(sys.argv[1],"w") as out:
                  out.write(token)
          except Exception as error:
              print("scoped_id_token_issue=BLOCKED class="+type(error).__name__)
              raise SystemExit(1)
          PY
          then
            echo "signed_identity_mint=$SERVICE BLOCKED_NO_PERMISSION_OR_PROVIDER_ERROR"
            exit 1
          fi
          unset ACCESS_TOKEN
          TOKEN="$(cat "$RUNNER_TEMP/identity-token")"
          rm -f "$RUNNER_TEMP/identity-token"
          if [[ "$SERVICE" == omniagent-agent-gateway ]]; then
            endpoints="/health"
          else
            endpoints="/health /ready"
          fi
          # Private endpoint allows only authorized identity; no response payloads printed.
          for endpoint in $endpoints; do
            status="$(curl --silent --show-error --max-time 35 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$URL$endpoint")"
            echo "signed_candidate_http=$SERVICE $endpoint status=$status"
            [[ "$status" == 200 ]] || { echo "signed_private_health=BLOCKED"; exit 1; }
          done
          echo "signed_private_health=PASS service=$SERVICE"
          # No POST inference or user data writes. Real provider integration remains OPEN.
