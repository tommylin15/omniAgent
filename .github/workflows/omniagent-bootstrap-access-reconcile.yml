name: omniAgent bootstrap access reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-bootstrap-access-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  OMNIAGENT_GCP_WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  OMNIAGENT_GCP_CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.OMNIAGENT_GCP_WIF_PROVIDER }}
          service_account: ${{ env.OMNIAGENT_GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Grant bounded bootstrap roles to omniAgent CI
        shell: bash
        run: |
          set -euo pipefail
          member="serviceAccount:${OMNIAGENT_GCP_CI_SERVICE_ACCOUNT}"
          for role in \
            roles/compute.viewer \
            roles/compute.osAdminLogin \
            roles/iap.tunnelResourceAccessor
          do
            gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
              --member="$member" \
              --role="$role" \
              --condition=None >/dev/null
            echo "$role=BOUND"
          done
