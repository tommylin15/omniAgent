# Current GHCR Chat / Gateway candidate: real IAM and HMAC negative-contract
# probes, plus a verified user-facing 0%-candidate URL for human OAuth.
# No provider requests: deliberately malformed/unsigned request only.
name: omniAgent GHCR Chat Gateway auth boundary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-ghcr-chat-gateway-auth-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: omniagent-ghcr-chat-gateway-auth-boundary
  cancel-in-progress: false

jobs:
  live-denials:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      ACCEPTED_SOURCE_SHA: f2a5be4425953b26f2340694765362c7bdc943c9
      CHAT_REVISION: omniagent-chat-00037-duj
      GATEWAY_REVISION: omniagent-agent-gateway-00028-rof
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify candidate URLs and test non-billable IAM/HMAC rejection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for svc in omniagent-chat omniagent-agent-gateway; do
            gcloud run services describe "$svc" --project="$PROJECT" --region="$REGION" \
              --format=json > "$RUNNER_TEMP/$svc.json"
          done
          # Short-lived access token is not logged and is never written to disk.
          export GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,os,sys,time,urllib.request,urllib.error
          from pathlib import Path
          from urllib.parse import quote,urlparse

          root=Path(sys.argv[1])
          sha=os.environ["ACCEPTED_SOURCE_SHA"]
          tag="ghcr-"+sha[:12]
          services={
            "omniagent-chat":os.environ["CHAT_REVISION"],
            "omniagent-agent-gateway":os.environ["GATEWAY_REVISION"],
          }
          refs={}
          def require(cond,category):
              if not cond:
                  raise SystemExit("BLOCKED: "+category)
          for name,revision in services.items():
              doc=json.loads((root/(name+".json")).read_text())
              traffic=(doc.get("status") or {}).get("traffic") or []
              live=[x for x in traffic if x.get("percent",0)>0]
              targets=[x for x in traffic if x.get("revisionName")==revision
                       and x.get("tag")==tag and x.get("percent",0)==0]
              require(len(live)==1 and live[0].get("percent")==100 and len(targets)==1,
                      "unexpected_live_traffic_or_candidate")
              origin=targets[0].get("url","").rstrip("/")
              audience=(doc.get("status") or {}).get("url","").rstrip("/")
              require(all(urlparse(u).scheme=="https" and urlparse(u).hostname
                          for u in (origin,audience)),"candidate_url_invalid")
              refs[name]=(origin,audience,live[0].get("revisionName"))
              print(name+"_tagged_revision_identity=PASS")
          chat,_,chat_serving=refs["omniagent-chat"]
          gateway,gateway_audience,gateway_serving=refs["omniagent-agent-gateway"]
          def http_code(url,method="GET",data=None,headers=None):
              request=urllib.request.Request(url,method=method,data=data,
                headers=headers or {})
              try:
                  with urllib.request.urlopen(request,timeout=35) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code
          require(http_code(chat+"/health")==200,"chat_health")
          require(http_code(chat+"/ready")==200,"chat_ready")
          require(http_code(chat+"/v1/threads")==401,"anonymous_chat_denial")
          require(http_code(gateway+"/health")==403,"anonymous_gateway_denial")
          print("anonymous_chat_and_gateway_boundary=PASS")

          email="omniagent-chat@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
          url="https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/"+quote(email,safe="")+":generateIdToken"
          payload=json.dumps({"audience":gateway_audience,"includeEmail":True}).encode()
          request=urllib.request.Request(url,method="POST",data=payload,
              headers={"Authorization":"Bearer "+os.environ["GOOGLE_ACCESS_TOKEN"],
                       "Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(request,timeout=25) as response:
                  token=json.load(response).get("token")
          except (urllib.error.HTTPError,urllib.error.URLError):
              raise SystemExit("BLOCKED: candidate IAM identity mint unavailable")
          require(isinstance(token,str) and bool(token),"iam_token_missing")
          headers={"Authorization":"Bearer "+token}
          require(http_code(gateway+"/health",headers=headers)==200,
                  "authorized_iam_gateway_health")
          print("chat_service_identity_to_private_gateway_iam=PASS")
          # These requests cannot initiate provider execution: the HMAC
          # is missing/invalid, so signedBody rejects before parsing the
          # body or entering the actual assistant dispatcher.
          body=b'{"runtime":"__invalid__","messages":[]}'
          reject_cases=[
              ("missing_hmac",{"Content-Type":"application/json"}),
              ("invalid_hmac",{
                  "Content-Type":"application/json",
                  "X-OmniAgent-Timestamp":str(int(time.time()*1000)),
                  "X-OmniAgent-Signature":"v1="+"0"*64}),
              ("expired_hmac",{
                  "Content-Type":"application/json",
                  "X-OmniAgent-Timestamp":str(int(time.time()*1000)-120_000),
                  "X-OmniAgent-Signature":"v1="+"0"*64}),
          ]
          for label,extra in reject_cases:
              status=http_code(gateway+"/internal/v1/assistant/turn",
                               method="POST",data=body,headers={**headers,**extra})
              print("gateway_"+label+"_denied_http="+str(status))
              require(status==400,"gateway_"+label+"_hmac_rejection")
          # Final readback: no formal allocation drift after the HTTP probes.
          for svc,(origin,aud,serving) in refs.items():
              cmd=["gcloud","run","services","describe",svc,
                   "--project="+os.environ["PROJECT"],
                   "--region="+os.environ["REGION"],"--format=json"]
              import subprocess
              current=json.loads(subprocess.run(cmd,capture_output=True,text=True,
                    check=True,timeout=35).stdout)
              live=[x for x in ((current.get("status") or {}).get("traffic") or [])
                     if x.get("percent",0)>0]
              require(len(live)==1 and live[0].get("revisionName")==serving
                      and live[0].get("percent")==100,"formal_traffic_drift")
          summary=Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as f:
              f.write("### Non-billable live Chat/Gateway IAM & HMAC negative contract\n\n")
              f.write("**PASS**: Cloud Run IAM, anonymous denials and three rejected invalid/absent HMAC cases.\n\n")
              f.write("Human OAuth candidate URL (0% formal traffic): "+chat+"\n\n")
              f.write("No provider invocation, database writes or traffic changes.\n")
              f.write("**NOT VERIFIED**: real Google two-account OAuth, accepted HMAC, provider dispatch or owner entitlement.\n")
          print("chat_gateway_candidate_nonbillable_auth_boundary=PASS")
          print("chat_candidate_browser_url="+chat)
          print("human_two_owner_oauth_and_paid_provider_dispatch=NOT_VERIFIED")
          print("formal_traffic_preserved=PASS")
          PY
