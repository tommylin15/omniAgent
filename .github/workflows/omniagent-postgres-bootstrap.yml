name: omniAgent shared PostgreSQL bootstrap preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-postgres-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  OMNIAGENT_GCP_WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  OMNIAGENT_GCP_CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
  SHARED_POSTGRES_VM_B64: amFudXMtcG9zdGdyZXMtZGV2
  SHARED_POSTGRES_SECRET_B64: amFudXMtcnVudGltZS1idW5kbGU=
  SHARED_POSTGRES_ZONE_B64: dXMtY2VudHJhbDEtYQ==

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.OMNIAGENT_GCP_WIF_PROVIDER }}
          service_account: ${{ env.OMNIAGENT_GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify bounded bootstrap access
        shell: bash
        run: |
          set -euo pipefail
          vm="$(printf '%s' "$SHARED_POSTGRES_VM_B64" | base64 -d)"
          secret="$(printf '%s' "$SHARED_POSTGRES_SECRET_B64" | base64 -d)"
          zone="$(printf '%s' "$SHARED_POSTGRES_ZONE_B64" | base64 -d)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          gcloud config set project "$GCP_PROJECT_ID" >/dev/null

          if gcloud secrets versions access latest               --secret="$secret"               --project="$GCP_PROJECT_ID" >"$work/shared.json" 2>"$work/secret.err"; then
            python3 - "$work/shared.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          if not isinstance(value, dict):
              raise SystemExit("shared bundle is not a JSON object")
          print("shared_postgres_secret=READABLE")
          print("shared_postgres_secret_keys="+str(len(value)))
          PY
          else
            echo "shared_postgres_secret=NOT_READABLE"
            sed -n '1,4p' "$work/secret.err"
          fi

          if gcloud secrets versions access latest               --secret=omniagent-bundle               --project="$GCP_PROJECT_ID" >"$work/omniagent-db" 2>"$work/omni.err"; then
            python3 - "$work/omniagent-db" <<'PY'
          import json, sys
          from urllib.parse import urlparse
          raw=open(sys.argv[1]).read().strip()
          if raw.startswith('{'):
              obj=json.loads(raw)
              raw=str(obj.get('chat_database_url') or obj.get('CHAT_DATABASE_URL') or '')
          u=urlparse(raw)
          print("omniagent_db_secret=READABLE")
          print("omniagent_db_user="+str(u.username or ''))
          print("omniagent_db_host="+str(u.hostname or ''))
          print("omniagent_db_port="+str(u.port or ''))
          print("omniagent_db_name="+str((u.path or '').lstrip('/')))
          PY
          else
            echo "omniagent_db_secret=NOT_READABLE"
            sed -n '1,4p' "$work/omni.err"
          fi

          set +e
          timeout 12 gcloud compute ssh "$vm"             --project="$GCP_PROJECT_ID"             --zone="$zone"             --tunnel-through-iap             --quiet             --command 'true' >"$work/ssh.out" 2>"$work/ssh.err"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "shared_postgres_iap=PASS"
          else
            echo "shared_postgres_iap=FAIL rc=$rc"
            sed -n '1,8p' "$work/ssh.err"
          fi
