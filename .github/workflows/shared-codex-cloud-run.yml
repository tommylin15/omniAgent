name: Shared Codex Cloud Run candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/shared-codex/**'
      - 'services/agent-gateway/server.ts'
      - 'infra/gcp/bootstrap-shared-codex-iam.sh'
      - '.github/workflows/shared-codex-cloud-run.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  WIF_PROVIDER: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
  CI_SERVICE_ACCOUNT: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
  SHARED_CODEX_SERVICE: omniagent-shared-codex
  SHARED_CODEX_RUNTIME_SA: omniagent-shared-codex@gen-lang-client-0593591102.iam.gserviceaccount.com
  SHARED_CODEX_AUTH_RESOURCE: projects/gen-lang-client-0593591102/secrets/omniagent-shared-codex-auth
  SHARED_CODEX_CALLERS_JSON: '{"market-mart":"omniagent-codex-market-client@gen-lang-client-0593591102.iam.gserviceaccount.com","life-assistant":"omniagent-codex-life-client@gen-lang-client-0593591102.iam.gserviceaccount.com","omniagent":"omniagent-codex-chat-client@gen-lang-client-0593591102.iam.gserviceaccount.com"}'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Source gate
        run: |
          bash -n infra/gcp/bootstrap-shared-codex-iam.sh
          npm ci
          npm run build
          npm test -- tests/shared_codex.test.ts
          # Packaging gate is independent of credentials and live provider access.
          docker build -f services/shared-codex/Dockerfile -t omniagent-shared-codex:ci .
          docker run --rm omniagent-shared-codex:ci /app/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex --version
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate approved secret and callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          r=os.environ.get("SHARED_CODEX_AUTH_RESOURCE","")
          if not re.fullmatch(r"projects/(?:gen-lang-client-0593591102|131494961796)/secrets/[a-zA-Z0-9_-]+",r):
              raise SystemExit("BLOCKED_AUTH: set SHARED_CODEX_AUTH_RESOURCE")
          d=json.loads(os.environ.get("SHARED_CODEX_CALLERS_JSON","{}"))
          if not isinstance(d,dict) or not d:
              raise SystemExit("BLOCKED_CALLERS: set SHARED_CODEX_CALLERS_JSON")
          for name,email in d.items():
              if not re.fullmatch(r"[a-z][a-z0-9-]{0,39}",name) or not isinstance(email,str) or not re.fullmatch(r"[a-z0-9][a-z0-9.-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com",email):
                  raise SystemExit("invalid caller config")
          print("approved_caller_count="+str(len(d)))
          PY
          secret="${SHARED_CODEX_AUTH_RESOURCE##*/}"
          gcloud secrets versions describe latest --secret="$secret" --project="$GCP_PROJECT_ID" \
            --format='value(state)' | grep -Fx ENABLED
      - name: Verify separately provisioned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "$SHARED_CODEX_RUNTIME_SA" \
            --project="$GCP_PROJECT_ID" --format='value(email)'
          echo "identity_readback=PASS"
      - name: Build immutable runtime image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/omniagent/${SHARED_CODEX_SERVICE}:${GITHUB_SHA}"
          docker build -f services/shared-codex/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "CANDIDATE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy IAM-protected Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          with open("/tmp/shared-codex-env.yaml","w") as out:
              json.dump({
                "SHARED_CODEX_CALLERS_JSON":os.environ["SHARED_CODEX_CALLERS_JSON"],
                "SHARED_CODEX_AUTH_RESOURCE":os.environ["SHARED_CODEX_AUTH_RESOURCE"],
                "SHARED_CODEX_AUDIENCE":"https://pending.invalid",
              },out)
          PY
          gcloud run deploy "$SHARED_CODEX_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$CANDIDATE_IMAGE" --service-account="$SHARED_CODEX_RUNTIME_SA" \
            --no-allow-unauthenticated --concurrency=1 --max-instances=1 \
            --min-instances=0 --cpu=1 --memory=1Gi --timeout=300 \
            --env-vars-file=/tmp/shared-codex-env.yaml --quiet
          URL="$(gcloud run services describe "$SHARED_CODEX_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update "$SHARED_CODEX_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --update-env-vars="SHARED_CODEX_AUDIENCE=$URL" --quiet
          echo "SHARED_CODEX_URL=$URL" >> "$GITHUB_ENV"
      - name: Verify authorized consumer identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/callers
          import os,json
          for email in sorted(set(json.loads(os.environ["SHARED_CODEX_CALLERS_JSON"]).values())):
              print(email)
          PY
          while IFS= read -r email; do
            gcloud run services add-iam-policy-binding "$SHARED_CODEX_SERVICE" \
              --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
              --member="serviceAccount:$email" --role=roles/run.invoker --quiet >/dev/null
          done < /tmp/callers
      - name: Live unauthenticated rejection and config readback
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -X POST -d '{}' \
            -o /tmp/unauth -w '%{http_code}' "$SHARED_CODEX_URL/v1/codex/execute")"
          test "$status" = 403
          gcloud run services describe "$SHARED_CODEX_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format=json > /tmp/shared.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/shared.json"))
          spec=d["spec"]["template"]["spec"]
          assert spec["serviceAccountName"]=="omniagent-shared-codex@gen-lang-client-0593591102.iam.gserviceaccount.com"
          assert spec["containerConcurrency"]==1
          assert d.get("status",{}).get("latestReadyRevisionName")
          print("deployment_readback=PASS")
          print("live_model_inference=NOT_YET_ACCEPTED")
          PY

      - name: Three caller live Codex inference and project isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/allowed-callers
          import os,json
          data=json.loads(os.environ["SHARED_CODEX_CALLERS_JSON"])
          for label,email in sorted(data.items()):
              print(label+"\t"+email)
          PY
          previous_label=""
          previous_token=""
          tested=0
          while IFS=$'\t' read -r label email; do
            token="$(gcloud auth print-identity-token \
              --impersonate-service-account="$email" --audiences="$SHARED_CODEX_URL" --include-email)"
            test -n "$token"
            LABEL="$label" python3 - <<'PY' > /tmp/codex-request.json
          import os,json,uuid
          print(json.dumps({
            "project":os.environ["LABEL"],
            "ownerId":str(uuid.uuid4()),
            "requestId":str(uuid.uuid4()),
            "prompt":"Reply with exactly the word READY. Do not use tools.",
          }))
          PY
            status="$(curl --silent --show-error --max-time 180 --retry 0 \
              -o /tmp/codex-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -X POST --data-binary @/tmp/codex-request.json "$SHARED_CODEX_URL/v1/codex/execute")"
            if [[ "$status" != "200" ]]; then
              echo "live_inference_failed caller=$label status=$status" >&2
              exit 1
            fi
            LABEL="$label" python3 - <<'PY'
          import os,json,hashlib
          data=json.load(open("/tmp/codex-response.json"))
          assert data.get("status")=="completed" and data.get("project")==os.environ["LABEL"]
          result=data.get("result") or {}
          text=result.get("text","")
          assert isinstance(text,str) and text.strip()
          ids=data.get("providerIds") or {}
          assert ids.get("threadId") and ids.get("turnId")
          print("caller="+os.environ["LABEL"]+" live_inference=PASS output_sha256="+hashlib.sha256(text.encode()).hexdigest())
          PY
            if [[ -n "$previous_label" ]]; then
              PREVIOUS="$previous_label" python3 - <<'PY' > /tmp/codex-cross-project.json
          import os,json,uuid
          print(json.dumps({
            "project":os.environ["PREVIOUS"],
            "ownerId":str(uuid.uuid4()),
            "requestId":str(uuid.uuid4()),
            "prompt":"Cross-project authorization test.",
          }))
          PY
              cross_status="$(curl --silent --show-error --max-time 20 \
                -o /tmp/codex-cross-response.json -w '%{http_code}' \
                -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
                -X POST --data-binary @/tmp/codex-cross-project.json "$SHARED_CODEX_URL/v1/codex/execute")"
              [[ "$cross_status" == "403" ]] || {
                echo "cross_project_rejection=FAIL" >&2
                exit 1
              }
              echo "cross_project_rejection=PASS"
            fi
            previous_label="$label"
            previous_token="$token"
            tested=$((tested+1))
          done < /tmp/allowed-callers
          [[ "$tested" == "3" ]] || { echo "caller_count_invalid" >&2; exit 1; }
          echo "all_configured_callers_live_inference=PASS"
