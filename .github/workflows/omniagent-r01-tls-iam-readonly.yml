name: omniAgent R01 TLS IAM read-only diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-r01-tls-iam-readonly.yml'
permissions:
  contents: read
  id-token: write
jobs:
  diagnostic:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact SHA only
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect service-scoped IAM and runtime identity without exposing config values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for service in omniagent-chat omniagent-agent-gateway; do
            gcloud run services describe "$service" \
              --project=gen-lang-client-0593591102 --region=us-central1 \
              --format=json > "$RUNNER_TEMP/$service.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for name in ("omniagent-chat","omniagent-agent-gateway"):
            s=json.loads((root/(name+".json")).read_text())
            spec=(s.get("spec") or {}).get("template",{}).get("spec",{})
            env={row.get("name"):row.get("value") for c in spec.get("containers",[]) for row in c.get("env",[])}
            print(name+"_runtime_service_account="+str(spec.get("serviceAccountName","NOT_CONFIGURED")))
            print(name+"_database_tls_mode="+str(env.get("CHAT_DATABASE_TLS_MODE","UNSET")))
            print(name+"_dispatch_enabled="+str(env.get("CHAT_DISPATCH_ENABLED","UNSET")))
          PY
          for service in omniagent-agent-gateway omniagent-chat; do
            if gcloud run services get-iam-policy "$service" \
              --project=gen-lang-client-0593591102 --region=us-central1 \
              --format=json > "$RUNNER_TEMP/$service.iam" 2>/dev/null; then
              python3 - "$RUNNER_TEMP/$service.iam" "$service" <<'PY'
          import json,sys
          from pathlib import Path
          policy=json.loads(Path(sys.argv[1]).read_text())
          members=[m for b in policy.get("bindings",[]) if b.get("role")=="roles/run.invoker" for m in b.get("members",[])]
          chat="serviceAccount:omniagent-chat@gen-lang-client-0593591102.iam.gserviceaccount.com"
          print(sys.argv[2]+"_chat_invoker_binding="+("PRESENT" if chat in members else "ABSENT_AT_SERVICE_SCOPE"))
          print(sys.argv[2]+"_public_invoker="+("YES" if any(m in ("allUsers","allAuthenticatedUsers") for m in members) else "NO_SERVICE_BINDING"))
          PY
            else
              echo "$service"_invoker_binding=NOT_VERIFIED_IAM_READ_DENIED
            fi
          done
      - name: Read PostgreSQL TLS certificate metadata and own DB schema, no credential values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HOST="$(printf '%s' 'amFudXMtcG9zdGdyZXMtZGV2' | base64 -d)"
          cat > "$RUNNER_TEMP/omniagent-r01-cert-read.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          CONTAINER="$(printf '%s' 'amFudXMtcG9zdGdyZXM=' | base64 -d)"
          trap 'sudo rm -f /tmp/omniagent-r01-cert-read.sh /tmp/omniagent-r01-public-cert.pem' EXIT
          pg() { sudo docker exec -u postgres "$CONTAINER" psql -X -At -v ON_ERROR_STOP=1 "$@"; }
          test "$(pg -d omniagent_chat -c "SELECT to_regclass('omni_chat.model_daily_budgets') IS NOT NULL")" = t
          echo r01_budget_migration_readback=PASS
          echo "postgres_ssl=$(pg -d postgres -c 'SHOW ssl')"
          cert="$(pg -d postgres -c 'SHOW ssl_cert_file')"
          data="$(pg -d postgres -c 'SHOW data_directory')"
          if [[ -z "$cert" || -z "$data" ]]; then
            echo cert_metadata=NOT_CONFIGURED
            exit 0
          fi
          if [[ "$cert" != /* ]]; then cert="$data/$cert"; fi
          if ! sudo docker cp "$CONTAINER:$cert" /tmp/omniagent-r01-public-cert.pem 2>/dev/null; then
            echo cert_metadata=UNAVAILABLE
            exit 0
          fi
          echo cert_metadata=PUBLIC_CERTIFICATE_READABLE
          openssl x509 -in /tmp/omniagent-r01-public-cert.pem \
            -noout -subject -issuer -ext subjectAltName -dates -fingerprint -sha256 || :
          if openssl verify -CAfile /tmp/omniagent-r01-public-cert.pem \
               /tmp/omniagent-r01-public-cert.pem >/dev/null 2>&1; then
            echo cert_single_pem_trust=PASS
          else
            echo cert_single_pem_trust=NOT_SELF_SIGNED_OR_MISSING_CHAIN
          fi
          REMOTE
          chmod 700 "$RUNNER_TEMP/omniagent-r01-cert-read.sh"
          gcloud compute scp "$RUNNER_TEMP/omniagent-r01-cert-read.sh" \
            "$HOST:/tmp/" --zone=us-central1-a --project=gen-lang-client-0593591102 \
            --tunnel-through-iap --quiet
          gcloud compute ssh "$HOST" --zone=us-central1-a \
            --project=gen-lang-client-0593591102 --tunnel-through-iap --quiet \
            --command='sudo bash /tmp/omniagent-r01-cert-read.sh'
