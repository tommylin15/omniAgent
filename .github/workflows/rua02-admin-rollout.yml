# RUA-02 Phase A: admin-only Chat usage analytics. Gateway remains explicitly
# not_configured; never touch GEMINI_SHARED_* policy or Chat model dispatch.
name: RUA-02 admin-only rollout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rua02-admin-rollout.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-rua02-live
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      SERVICE: omniagent-chat
      OWNER: 8b330f02-639d-4284-9e79-b2f183f74d06
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Freeze production identity, image and revision traffic
        id: pre
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/before.json"
          python3 - "$RUNNER_TEMP/before.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          status=s['status']
          active=[x for x in status['traffic'] if x.get('percent',0)>0]
          if len(active)!=1 or active[0].get('percent')!=100 or active[0].get('revisionName')!=status.get('latestReadyRevisionName'):
            raise SystemExit('BLOCKED_UNVERIFIED_FORMAL_TRAFFIC')
          spec=s['spec']['template']['spec']
          containers=spec['containers']
          if len(containers)!=1: raise SystemExit('BLOCKED_UNEXPECTED_CONTAINERS')
          env={x['name']:x for x in containers[0].get('env',[])}
          if env.get('CHAT_DISPATCH_ENABLED',{}).get('valueFrom') or env.get('CHAT_DISPATCH_ENABLED',{}).get('value','false')!='false':
            raise SystemExit('BLOCKED_CHAT_DISPATCH_MUST_REMAIN_OFF')
          if any(name in env for name in ('ROUTER_USAGE_ENABLED','ROUTER_USAGE_ADMIN_OWNER_IDS',
                      'ROUTER_USAGE_GATEWAY_DATABASE_URL','ROUTER_USAGE_GATEWAY_CA_PEM')):
            raise SystemExit('BLOCKED_RUA_CONFIG_ALREADY_PRESENT_REVIEW_REQUIRED')
          if 'OMNIAGENT_BUNDLE' not in env: raise SystemExit('BLOCKED_CHAT_STORAGE_BUNDLE_ABSENT')
          image=containers[0].get('image')
          if not image or not image.startswith('ghcr.io/tommylin15/omniagent-chat@sha256:'):
            raise SystemExit('BLOCKED_IMAGE_NOT_DIGEST_PINNED')
          with open(sys.argv[2],'a') as fh:
            fh.write('image='+image+'\n')
            fh.write('fallback='+active[0]['revisionName']+'\n')
          print('RUA_PRE_PROMOTION_RUNTIME=VERIFIED')
          PY
      - name: Deploy admin read-only API as zero traffic candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          # Image is read from preflight receipt; avoid changing backend versions.
          image="$(python3 - "$RUNNER_TEMP/before.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['spec']['template']['spec']['containers'][0]['image'])
          PY
          )"
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$image" --no-traffic --tag=rua02-admin \
            --update-env-vars="ROUTER_USAGE_ENABLED=true,ROUTER_USAGE_ADMIN_OWNER_IDS=$OWNER" \
            --quiet >/dev/null
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/candidate.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          b,a=(json.load(open(p)) for p in sys.argv[1:3])
          def serving(s):
            return {(x.get('revisionName'),x['percent']) for x in s['status']['traffic'] if x.get('percent',0)>0}
          if serving(a)!=serving(b): raise SystemExit('BLOCKED_FORMAL_TRAFFIC_CHANGED')
          old=b['spec']['template']['spec']
          new=a['spec']['template']['spec']
          if {k:v for k,v in old.items() if k!='containers'} != {k:v for k,v in new.items() if k!='containers'}:
            raise SystemExit('BLOCKED_SERVICE_SPEC_CHANGED')
          if len(new['containers'])!=1: raise SystemExit('BLOCKED_CONTAINER_COUNT')
          old_env={e['name']:e for e in old['containers'][0].get('env',[])}
          new_env={e['name']:e for e in new['containers'][0].get('env',[])}
          for k,v in old_env.items():
            if new_env.get(k)!=v: raise SystemExit('BLOCKED_EXISTING_ENV_CHANGED:'+k)
          if set(new_env)-set(old_env)!={'ROUTER_USAGE_ENABLED','ROUTER_USAGE_ADMIN_OWNER_IDS'}:
            raise SystemExit('BLOCKED_UNKNOWN_NEW_ENV')
          if new_env['ROUTER_USAGE_ENABLED'].get('value')!='true' or new_env['ROUTER_USAGE_ADMIN_OWNER_IDS'].get('value')!='8b330f02-639d-4284-9e79-b2f183f74d06':
            raise SystemExit('BLOCKED_WRONG_ADMIN_SCOPE')
          if {k:v for k,v in old['containers'][0].items() if k!='env'} != {k:v for k,v in new['containers'][0].items() if k!='env'}:
            raise SystemExit('BLOCKED_CONTAINER_CHANGED')
          new_revision=a['status']['latestReadyRevisionName']
          if new_revision==b['status']['latestReadyRevisionName']:
            raise SystemExit('BLOCKED_NO_NEW_READY_REVISION')
          tag=[x for x in a['status']['traffic'] if x.get('tag')=='rua02-admin']
          if len(tag)!=1 or tag[0].get('revisionName')!=new_revision or not tag[0].get('url'):
            raise SystemExit('BLOCKED_CANDIDATE_TAG_NOT_VERIFIED')
          with open(sys.argv[3],'a') as fh:
            fh.write('candidate='+new_revision+'\n')
            fh.write('candidate_url='+tag[0]['url']+'\n')
          print('RUA_CANDIDATE_CONFIG_ISOLATION=PASS')
          PY
      - name: Zero traffic API smoke and anonymous auth rejection
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${{ steps.candidate.outputs.candidate_url }}"
          if [[ -z "$endpoint" ]]; then
            endpoint="$(python3 - "$RUNNER_TEMP/candidate.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          print(next(x['url'] for x in a['status']['traffic'] if x.get('tag')=='rua02-admin'))
          PY
          )"
          fi
          for path in /health /ready; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$endpoint$path")"
            [[ "$code" == 200 ]] || { echo "::error::candidate $path expected 200, got $code"; exit 1; }
          done
          for path in /v1/me /v1/admin/router-usage /v1/admin/router-usage?days=30; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$endpoint$path")"
            [[ "$code" == 401 ]] || { echo "::error::unauthenticated $path expected 401, got $code"; exit 1; }
          done
          echo 'RUA_CANDIDATE_ANON_BOUNDARY=PASS'
      - name: Promote inspected candidate to formal Chat 100 percent
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python3 - "$RUNNER_TEMP/candidate.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          print(a['status']['latestReadyRevisionName'])
          PY
          )"
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT" --region="$REGION" --to-revisions="$candidate=100" --quiet >/dev/null
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/after.json"
          python3 - "$RUNNER_TEMP/after.json" "$candidate" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          live=[x for x in a['status']['traffic'] if x.get('percent',0)>0]
          if len(live)!=1 or live[0].get('revisionName')!=sys.argv[2] or live[0].get('percent')!=100 or a['status']['latestReadyRevisionName']!=sys.argv[2]:
            raise SystemExit('RUA_FORMAL_READBACK_NOT_VERIFIED')
          print('RUA_CHAT_ADMIN_FORMAL_TRAFFIC=PASS')
          print('RUA_SHARED_GATEWAY_LEDGER=NOT_CONFIGURED')
          print('RUA_ADMIN_HUMAN_200=NOT_VERIFIED')
          PY
