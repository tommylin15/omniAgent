# One-time guarded promotion of a previously accepted zero-traffic Gemini-only
# owner candidate to the stable 'preview' alias; NEVER formal traffic.
name: omniAgent Chat fixed Preview bind to P0-V canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omniagent-chat-fixed-preview-p0v.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: omniagent-ghcr-cloudrun-release
  cancel-in-progress: false
jobs:
  bind:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      CHAT: omniagent-chat
      GATEWAY: omniagent-agent-gateway
      EXPECTED_SOURCE: 1cb6542b178db026f8bb1714d71ae43c5721af25
      EXPECTED_OLD_PREVIEW: omniagent-chat-00039-rik
      EXPECTED_CANARY: omniagent-chat-00077-xas
      FIXED_PREVIEW_URL: https://preview---omniagent-chat-2oo7qbkd5q-uc.a.run.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Independently verify immutable owner-scoped target and existing formal routing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$CHAT" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services describe "$GATEWAY" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/gateway.json"
          gcloud run revisions describe "$EXPECTED_CANARY" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/canary.json"
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/gateway.json" "$RUNNER_TEMP/canary.json" <<'PY'
          import hashlib,json,os,re,sys
          chat,gate,rev=(json.load(open(p)) for p in sys.argv[1:4])
          routes=(chat.get("status") or {}).get("traffic") or []
          gate_routes=(gate.get("status") or {}).get("traffic") or []
          tagged=lambda label:[x for x in routes if x.get("tag")==label]
          formal={x.get("revisionName"):x.get("percent",0) for x in routes if x.get("percent",0)>0}
          if len(formal)!=1 or next(iter(formal.values()))!=100:
              raise SystemExit("BLOCKED: formal Chat serving route must be exactly one 100% revision")
          old=tagged("preview")
          if len(old)!=1 or old[0].get("percent",0)!=0 or old[0].get("revisionName") not in (
              os.environ["EXPECTED_OLD_PREVIEW"],os.environ["EXPECTED_CANARY"]):
              raise SystemExit("BLOCKED: Preview alias deviated from approved snapshot")
          if old[0].get("url","").rstrip("/")!=os.environ["FIXED_PREVIEW_URL"]:
              raise SystemExit("BLOCKED: fixed Preview hostname unexpected")
          owner_candidate=tagged("p0v-gemini-chat-"+os.environ["EXPECTED_SOURCE"][:8])
          if len(owner_candidate)!=1 or owner_candidate[0].get("percent",0)!=0 or (
              owner_candidate[0].get("revisionName")!=os.environ["EXPECTED_CANARY"]):
              raise SystemExit("BLOCKED: pinned Gemini-only candidate not at 0%")
          tag="ghcr-"+os.environ["EXPECTED_SOURCE"][:12]
          matching_gateway=[x for x in gate_routes if x.get("tag")==tag and x.get("percent",0)==0]
          if len(matching_gateway)!=1:
              raise SystemExit("BLOCKED: signed Gateway target missing or receiving traffic")
          chat_spec=(((chat.get("spec") or {}).get("template") or {}).get("spec") or {})
          original=chat_spec.get("containers") or []
          target_spec=rev.get("spec") or {}
          containers=target_spec.get("containers") or []
          if len(original)!=1 or len(containers)!=1:
              raise SystemExit("BLOCKED: unexpected container count")
          if original[0].get("image","").startswith("ghcr.io/tommylin15/omniagent-chat@sha256:") is False:
              raise SystemExit("BLOCKED: current Chat source is not pinned GHCR")
          digest=original[0]["image"].split("@sha256:")[-1]
          candidate_image=containers[0].get("image","")
          if not re.fullmatch(r"[a-f0-9]{64}",digest) or not candidate_image.endswith("@sha256:"+digest):
              raise SystemExit("BLOCKED: candidate image digest differs from approved current Chat source")
          if target_spec.get("serviceAccountName")!=chat_spec.get("serviceAccountName") or (
              target_spec.get("vpcAccess")!=chat_spec.get("vpcAccess")):
              raise SystemExit("BLOCKED: candidate runtime service identity or VPC changed")
          ready=(rev.get("status") or {}).get("conditions") or []
          if not any(x.get("type")=="Ready" and x.get("status")=="True" for x in ready):
              raise SystemExit("BLOCKED: candidate revision not Ready")
          env={x.get("name"):x for x in containers[0].get("env") or []}
          if env.get("CHAT_DISPATCH_ENABLED",{}).get("value")!="true":
              raise SystemExit("BLOCKED: candidate Chat dispatch not enabled")
          raw_owner=env.get("CHAT_DISPATCH_APPROVED_OWNER_IDS",{}).get("value","")
          expected_hash="bd46f8f29ba78faaa606f03d6a760c1726ce27a7cd75381d5c04b9525861f70f"
          if not re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){4}[0-9a-f]{8}",raw_owner) and not re.fullmatch(r"[0-9a-f-]{36}",raw_owner):
              raise SystemExit("BLOCKED: malformed approved owner")
          if hashlib.sha256(raw_owner.encode()).hexdigest()!=expected_hash:
              raise SystemExit("BLOCKED: unexpected owner entitlement")
          try: entitlements=json.loads(env["CHAT_DISPATCH_ENTITLEMENTS_JSON"]["value"])
          except (KeyError,ValueError,TypeError):raise SystemExit("BLOCKED: Chat entitlement JSON missing")
          if entitlements != [{"ownerId":raw_owner,"runtime":"gemini",
                               "model":"gemini-3.5-flash-lite","credentialMode":"platform"}]:
              raise SystemExit("BLOCKED: candidate entitlement not exactly scoped to Gemini-only owner")
          if env.get("CHAT_GATEWAY_URL",{}).get("value","").rstrip("/")!=matching_gateway[0].get("url","").rstrip("/"):
              raise SystemExit("BLOCKED: candidate Gateway signed URL changed")
          if env.get("CHAT_GATEWAY_AUDIENCE",{}).get("value","").rstrip("/")!=(
               gate.get("status") or {}).get("url","").rstrip("/"):
              raise SystemExit("BLOCKED: candidate Gateway signed audience changed")
          if "OMNIAGENT_BUNDLE" not in env or env.get("CHAT_BYOK_MANAGEMENT_ENABLED",{}).get("value")=="true":
              raise SystemExit("BLOCKED: signed source bundle unavailable or BYOK turned on")
          old_env={x.get("name"):x for x in original[0].get("env") or []}
          if old_env.get("CHAT_DISPATCH_ENABLED",{}).get("value")!="false" or any(
              name in old_env for name in ("CHAT_DISPATCH_APPROVED_OWNER_IDS","CHAT_DISPATCH_ENTITLEMENTS_JSON",
                                          "CHAT_GATEWAY_URL","CHAT_GATEWAY_AUDIENCE")):
              raise SystemExit("BLOCKED: production template dispatch not safely disabled")
          print("old_preview_revision="+old[0]["revisionName"])
          print("verified_owner_scope=EXACT_ONE_GEMINI_FLASH_LITE")
          print("verified_target_revision="+os.environ["EXPECTED_CANARY"])
          print("verified_pinned_digest_and_signed_route=PASS")
          print("formal_serving_untouched=PASS")
          PY
          for path in /health /ready / /main.dart.js; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "$FIXED_PREVIEW_URL$path")"
            echo "old_preview_readiness_$path=$code"
            test "$code" = 200
          done
          for path in /v1/models /v1/threads; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "$FIXED_PREVIEW_URL$path")"
            echo "old_preview_anonymous_$path=$code"
            test "$code" = 401
          done
      - name: Safely bind fixed Preview only and independently read back
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'PY'
          import json,os,subprocess,sys,urllib.request,urllib.error
          from pathlib import Path
          before=json.load(open(sys.argv[1]))
          old=[x for x in (before.get("status") or {}).get("traffic") or [] if x.get("tag")=="preview"][0]["revisionName"]
          target=os.environ["EXPECTED_CANARY"]
          base=["gcloud","run","services"]
          args=["--project="+os.environ["PROJECT"],"--region="+os.environ["REGION"],"--quiet"]
          def describe():
              return json.loads(subprocess.check_output(
                  base[:2]+["services","describe",os.environ["CHAT"]]+args[:2]+["--format=json"],text=True,timeout=35))
          def formal(doc):
              return {x.get("revisionName"):x.get("percent",0) for x in (doc.get("status") or {}).get("traffic") or [] if x.get("percent",0)>0}
          def others(doc):
              return {x.get("tag"):x.get("revisionName") for x in (doc.get("status") or {}).get("traffic") or []
                  if x.get("tag") and x.get("tag")!="preview"}
          def cfg(doc):
              content=dict(doc.get("spec") or {})
              content.pop("traffic",None)
              return json.dumps(content,sort_keys=True)
          def assert_unchanged(doc):
              if formal(doc)!=formal(before) or others(doc)!=others(before) or cfg(doc)!=cfg(before):
                  raise RuntimeError("BLOCKED: formal serving / non-preview tags / config changed")
          def preview(doc):
              rows=[x for x in (doc.get("status") or {}).get("traffic") or [] if x.get("tag")=="preview"]
              return rows[0]["revisionName"] if len(rows)==1 and rows[0].get("percent",0)==0 else None
          def http():
              origin=os.environ["FIXED_PREVIEW_URL"]
              for path,expect in [("/health",200),("/ready",200),("/",200),("/main.dart.js",200),
                                  ("/v1/models",401),("/v1/threads",401)]:
                  try:
                      with urllib.request.urlopen(origin+path,timeout=25) as r: code=r.status
                  except urllib.error.HTTPError as e: code=e.code
                  if code!=expect:raise RuntimeError("BLOCKED: fixed Preview HTTP check "+path)
          current=describe()
          assert_unchanged(current)
          if preview(current)!=old:
              raise SystemExit("BLOCKED: Preview changed between preflight and update")
          moved=False
          try:
              if old!=target:
                  subprocess.run(["gcloud","run","services","update-traffic",os.environ["CHAT"],
                      "--project="+os.environ["PROJECT"],"--region="+os.environ["REGION"],
                      "--update-tags=preview="+target,"--quiet"],check=True,
                      capture_output=True,text=True,timeout=110)
                  moved=True
              after=describe()
              assert_unchanged(after)
              if preview(after)!=target:raise RuntimeError("BLOCKED: wrong Preview target after update")
              http()
              Path(sys.argv[2]).write_text(json.dumps({"target":target,"formal":formal(after),"preview":preview(after)}))
              print("fixed_preview_bind=PASS")
              print("fixed_preview_url="+os.environ["FIXED_PREVIEW_URL"])
              print("fixed_preview_revision="+target)
              print("other_tags_unchanged=PASS")
              print("formal_traffic_untouched=PASS")
              print("actual_user_oauth_and_model_reply=NOT_VERIFIED")
          except Exception:
              if moved:
                  try:
                      current=describe()
                      assert_unchanged(current)
                      if preview(current)==target:
                          subprocess.run(["gcloud","run","services","update-traffic",os.environ["CHAT"],
                              "--project="+os.environ["PROJECT"],"--region="+os.environ["REGION"],
                              "--update-tags=preview="+old,"--quiet"],check=True,
                              capture_output=True,text=True,timeout=110)
                          recovered=describe()
                          assert_unchanged(recovered)
                          if preview(recovered)!=old:raise RuntimeError("preview rollback readback mismatch")
                          http()
                          print("fixed_preview_recovery=PASS")
                      elif preview(current)==old: print("fixed_preview_recovery=NO_CHANGE")
                      else: raise RuntimeError("preview moved by another operator")
                  except Exception:
                      print("fixed_preview_recovery=BLOCKED_MANUAL_DIAGNOSIS")
              raise
          PY
