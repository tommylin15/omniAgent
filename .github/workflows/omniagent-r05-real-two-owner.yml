# R05 genuine-user boundary. Never use service-account tokens as Google users.
# Runs in isolation from the standard release. Missing legitimate ID tokens
# MUST fail this gate without blocking the existing safe 0%-traffic candidate.
name: omniAgent R05 real two Google Owners E2E
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r05_real_two_owner.py'
      - 'tests/test_r05_real_two_owner.py'
      - '.github/workflows/omniagent-r05-real-two-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  genuine-two-owner:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact current main and local harness tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python3 -m unittest discover -s tests -p test_r05_real_two_owner.py -v
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify two genuine Google user sessions on the exact 0% Chat candidate
        shell: bash
        env:
          R05_OWNER_A_GOOGLE_ID_TOKEN: ${{ secrets.R05_OWNER_A_GOOGLE_ID_TOKEN }}
          R05_OWNER_B_GOOGLE_ID_TOKEN: ${{ secrets.R05_OWNER_B_GOOGLE_ID_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # Only allowlisted, sanitized status lines are written to the report.
          python3 scripts/r05_real_two_owner.py "$SOURCE_SHA" > "$RUNNER_TEMP/r05-real-owner-e2e.txt" || {
            cat "$RUNNER_TEMP/r05-real-owner-e2e.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          grep -qx 'r05_two_user_live_auth_boundary=PASS' "$RUNNER_TEMP/r05-real-owner-e2e.txt"
          grep -qx 'r05_formal_traffic_unchanged=PASS' "$RUNNER_TEMP/r05-real-owner-e2e.txt"
          grep -qx 'r05_provider_execution=ZERO_NO_MESSAGE_POST' "$RUNNER_TEMP/r05-real-owner-e2e.txt"
          cat "$RUNNER_TEMP/r05-real-owner-e2e.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-genuine-two-owner-gate-${{ github.sha }}
          path: ${{ runner.temp }}/r05-real-owner-e2e.txt
          if-no-files-found: warn
          retention-days: 30
