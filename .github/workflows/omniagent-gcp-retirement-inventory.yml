# Read-only audit; does not fetch GCS object contents or mutate Cloud Run, GCS, AR, or Cloud Build.
name: omniAgent GCP retirement inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-gcp-retirement-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Cloud Run source registry and traffic status
        shell: bash
        run: |
          set -euo pipefail
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$svc" --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/service.json"
            python3 - "$svc" "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[2]))
          images=[c.get("image","") for c in s.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[])]
          origins=["GHCR" if i.startswith("ghcr.io/") else "AR" if ".pkg.dev/" in i else "OTHER" for i in images]
          active=[(x.get("revisionName"),x.get("percent",0)) for x in s.get("status",{}).get("traffic",[]) if x.get("percent",0)>0]
          print(json.dumps({"service":sys.argv[1],"image_registry":origins,"traffic":active,
              "latest_ready":s.get("status",{}).get("latestReadyRevisionName")},sort_keys=True))
          PY
          done
      - name: Legacy Cloud Build trigger state - read only
        shell: bash
        run: |
          set -euo pipefail
          if gcloud builds triggers list --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/triggers.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/triggers.json" <<'PY'
          import json,sys
          for t in json.load(open(sys.argv[1])):
              if "omniagent" in str(t.get("name","")).lower():
                  print(json.dumps({"name":t.get("name"),"id":t.get("id"),"disabled":t.get("disabled",False)},sort_keys=True))
          PY
          else
            echo "cloudbuild_triggers=NOT_READABLE"
          fi
      - name: Legacy Artifact Registry repository - metadata only
        shell: bash
        run: |
          if gcloud artifacts repositories describe omniagent --location=us-central1 --project=gen-lang-client-0593591102 --format='value(name,format,mode)' 2>/dev/null; then
            echo "ar_repository=EXISTS_IN_US_CENTRAL1"
          else
            echo "ar_repository=NOT_READABLE_OR_NOT_FOUND"
          fi
      - name: Legacy Cloud Build GCS buckets - metadata only
        shell: bash
        run: |
          set -euo pipefail
          for bucket in gen-lang-client-0593591102-cloudbuild-regional gen-lang-client-0593591102_cloudbuild; do
            if gcloud storage buckets describe "gs://$bucket" --project=gen-lang-client-0593591102 --format='value(name,location)' 2>/dev/null; then
              echo "gcs_bucket=$bucket status=EXISTS"
            else
              echo "gcs_bucket=$bucket status=NOT_READABLE_OR_NOT_FOUND"
            fi
          done
          echo "deletion_performed=NONE"

      - name: Verify manually disabled legacy triggers by immutable IDs
        shell: bash
        run: |
          set -euo pipefail
          P=gen-lang-client-0593591102
          for item in 'omniagent-main-v2 78b4219e-b65c-4e7f-9d75-0f12f7b87e05' 'omniagent-release-v2 14c90fda-6a46-4d04-ae0e-398f4be93fc4'; do
            read -r name id <<< "$item"
            if gcloud builds triggers describe "$id" --region=us-central1 --project="$P" --format=json > "$RUNNER_TEMP/trigger.json" 2>/dev/null; then
              python3 - "$RUNNER_TEMP/trigger.json" "$name" "$id" <<'PY'
          import json,sys
          t=json.load(open(sys.argv[1]))
          verified=t.get("id")==sys.argv[3] and t.get("name")==sys.argv[2]
          print("legacy_trigger="+sys.argv[2]+" id_verified="+str(verified)+" disabled="+str(t.get("disabled",False)) if verified else
                "legacy_trigger="+sys.argv[2]+" status=IDENTITY_MISMATCH")
          PY
            else
              echo "legacy_trigger=$name status=NOT_READABLE_OR_NOT_FOUND"
            fi
          done
      - name: Inventory Cloud Run AR references including retained revisions and jobs
        shell: bash
        run: |
          set -euo pipefail
          P=gen-lang-client-0593591102
          R=us-central1
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            if gcloud run revisions list --service="$svc" --project="$P" --region="$R" --format=json > "$RUNNER_TEMP/revisions.json" 2>/dev/null; then
              python3 - "$RUNNER_TEMP/revisions.json" "$svc" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          ar=ghcr=other=0
          for row in rows:
              spec=(row.get("spec") or {})
              for container in spec.get("containers") or []:
                  img=str(container.get("image",""))
                  if ".pkg.dev/" in img: ar+=1
                  elif img.startswith("ghcr.io/"): ghcr+=1
                  else: other+=1
          print("revision_image_references service="+sys.argv[2]+
                " ar="+str(ar)+" ghcr="+str(ghcr)+" other="+str(other)+
                " total_revisions="+str(len(rows)))
          PY
            else
              echo "revision_image_references service=$svc status=NOT_READABLE"
            fi
          done
          if gcloud run jobs list --project="$P" --region="$R" --format=json > "$RUNNER_TEMP/jobs.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/jobs.json" <<'PY'
          import json,sys
          jobs=json.load(open(sys.argv[1]))
          scoped=[x for x in jobs if "omniagent" in str(x.get("metadata",{}).get("name","")).lower()]
          print("omniagent_cloudrun_jobs_count="+str(len(scoped)))
          for job in scoped:
              spec=job.get("spec") or {}
              template=((spec.get("template") or {}).get("spec") or {}).get("template") or {}
              containers=(template.get("spec") or {}).get("containers") or []
              refs=[str(c.get("image","")) for c in containers]
              if not refs: origin="UNKNOWN"
              elif any(".pkg.dev/" in x for x in refs): origin="AR"
              elif all(x.startswith("ghcr.io/") for x in refs): origin="GHCR"
              else: origin="OTHER"
              print("omniagent_job_image_origin="+str(job.get("metadata",{}).get("name","UNKNOWN"))+
                    " origin="+origin)
          PY
          else
            echo "omniagent_cloudrun_jobs=NOT_READABLE"
          fi
      - name: Scoped Artifact Registry and GCS deletion eligibility
        shell: bash
        run: |
          set -euo pipefail
          P=gen-lang-client-0593591102
          R=us-central1
          if gcloud artifacts packages list --project="$P" --location="$R" --repository=omniagent --format=json > "$RUNNER_TEMP/packages.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/packages.json" <<'PY'
          import json,sys
          pkgs=json.load(open(sys.argv[1]))
          print("ar_scoped_package_count="+str(len(pkgs)))
          for pkg in pkgs:
              name=str(pkg.get("name","")).split("/")[-1]
              if name in ("omniagent-chat","omniagent-agent-gateway","omniagent-shared-codex","omniagent-postgres"):
                  print("ar_scoped_package="+name+" status=DEPENDENCY_REVIEW_REQUIRED")
              else:
                  print("ar_unknown_package_present=YES")
          PY
          else
            echo "ar_scoped_packages=NOT_READABLE"
          fi
          if gcloud artifacts repositories list --project="$P" --format=json > "$RUNNER_TEMP/all-ar.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/all-ar.json" <<'PY'
          import json,sys
          repos=json.load(open(sys.argv[1]))
          names=[x for x in repos if str(x.get("name","")).split("/")[-1]=="omniagent"]
          print("ar_named_omniagent_repositories="+str(len(names)))
          PY
          else
            echo "ar_repository_inventory=NOT_READABLE"
          fi
          if gcloud storage buckets list --project="$P" --format=json > "$RUNNER_TEMP/buckets.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/buckets.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print("gcs_bucket_inventory=READABLE count="+str(len(rows)))
          for b in rows:
              name=str(b.get("name",""))
              if "omniagent" in name.lower() or "cloudbuild" in name.lower():
                  print("gcs_retirement_candidate="+name+
                        " retention_configured="+str(bool(b.get("retentionPolicy")))+
                        " hold_configured="+str(bool(b.get("defaultEventBasedHold")))+
                        " versioning="+str(bool((b.get("versioning") or {}).get("enabled")))+
                        " policy_review=REQUIRED")
          PY
          else
            echo "gcs_bucket_inventory=NO_PERMISSION_OR_UNAVAILABLE"
          fi
          echo "retirement_decision=BLOCKED_UNTIL_DEPENDENCY_AND_APPROVED_MANIFEST"
          echo "deletion_performed=NONE"

      - name: Post-cleanup real serving revision probes (read only)
        shell: bash
        run: |
          set -euo pipefail
          P=gen-lang-client-0593591102
          R=us-central1
          for row in "omniagent-chat anonymous" "omniagent-agent-gateway omniagent-chat" "omniagent-shared-codex omniagent-codex-chat-client"; do
            read -r svc caller <<< "$row"
            gcloud run services describe "$svc" --project="$P" --region="$R" --format=json > "$RUNNER_TEMP/live-service.json"
            IFS=$'\t' read -r origin revision <<< "$(python3 - "$RUNNER_TEMP/live-service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1])).get("status") or {}
          live=[x for x in s.get("traffic") or [] if x.get("percent",0)>0]
          if len(live)!=1 or live[0].get("percent")!=100:
              raise SystemExit("BLOCKED: unexpected production split")
          name=str(live[0].get("revisionName",""))
          if not name.startswith("omniagent-") or not s.get("url","").startswith("https://"):
              raise SystemExit("BLOCKED: invalid serving target")
          print(s["url"].rstrip("/")+"\t"+name)
          PY
          )"
            if [[ "$caller" == anonymous ]]; then
              token=""
            else
              token="$(gcloud auth print-identity-token \
                --impersonate-service-account="$caller@$P.iam.gserviceaccount.com" \
                --audiences="$origin" --include-email 2>/dev/null)" || {
                  echo "post_cleanup_health=$svc revision=$revision status=IDENTITY_UNAVAILABLE"
                  exit 1
                }
              [[ -n "$token" ]] || exit 1
            fi
            for endpoint in /health $(if [[ "$svc" == omniagent-chat ]]; then echo /ready; fi); do
              if [[ "$caller" == anonymous ]]; then
                status="$(curl -sS --max-time 35 -o /dev/null -w '%{http_code}' "$origin$endpoint")"
              else
                status="$(curl -sS --max-time 35 -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $token" "$origin$endpoint")"
              fi
              echo "post_cleanup_health=$svc revision=$revision route=$endpoint http=$status"
              [[ "$status" == 200 ]] || exit 1
            done
            unset token
          done
          echo "post_cleanup_production_health=PASS"
