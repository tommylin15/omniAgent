# Read-only audit; does not fetch GCS object contents or mutate Cloud Run, GCS, AR, or Cloud Build.
name: omniAgent GCP retirement inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-gcp-retirement-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Cloud Run source registry and traffic status
        shell: bash
        run: |
          set -euo pipefail
          for svc in omniagent-chat omniagent-agent-gateway omniagent-shared-codex; do
            gcloud run services describe "$svc" --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/service.json"
            python3 - "$svc" "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[2]))
          images=[c.get("image","") for c in s.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[])]
          origins=["GHCR" if i.startswith("ghcr.io/") else "AR" if ".pkg.dev/" in i else "OTHER" for i in images]
          active=[(x.get("revisionName"),x.get("percent",0)) for x in s.get("status",{}).get("traffic",[]) if x.get("percent",0)>0]
          print(json.dumps({"service":sys.argv[1],"image_registry":origins,"traffic":active,
              "latest_ready":s.get("status",{}).get("latestReadyRevisionName")},sort_keys=True))
          PY
          done
      - name: Legacy Cloud Build trigger state - read only
        shell: bash
        run: |
          set -euo pipefail
          if gcloud builds triggers list --project=gen-lang-client-0593591102 --region=us-central1 --format=json > "$RUNNER_TEMP/triggers.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/triggers.json" <<'PY'
          import json,sys
          for t in json.load(open(sys.argv[1])):
              if "omniagent" in str(t.get("name","")).lower():
                  print(json.dumps({"name":t.get("name"),"id":t.get("id"),"disabled":t.get("disabled",False)},sort_keys=True))
          PY
          else
            echo "cloudbuild_triggers=NOT_READABLE"
          fi
      - name: Legacy Artifact Registry repository - metadata only
        shell: bash
        run: |
          if gcloud artifacts repositories describe omniagent --location=us-central1 --project=gen-lang-client-0593591102 --format='value(name,format,mode)' 2>/dev/null; then
            echo "ar_repository=EXISTS_IN_US_CENTRAL1"
          else
            echo "ar_repository=NOT_READABLE_OR_NOT_FOUND"
          fi
      - name: Legacy Cloud Build GCS buckets - metadata only
        shell: bash
        run: |
          set -euo pipefail
          for bucket in gen-lang-client-0593591102-cloudbuild-regional gen-lang-client-0593591102_cloudbuild; do
            if gcloud storage buckets describe "gs://$bucket" --project=gen-lang-client-0593591102 --format='value(name,location)' 2>/dev/null; then
              echo "gcs_bucket=$bucket status=EXISTS"
            else
              echo "gcs_bucket=$bucket status=NOT_READABLE_OR_NOT_FOUND"
            fi
          done
          echo "deletion_performed=NONE"
