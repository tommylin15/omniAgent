# GHCR-public transition. No Cloud Build, Artifact Registry or GCS calls.
name: omniAgent GHCR image publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-ghcr-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omniagent-ghcr-publish
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Node security, Python and Postgres
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash -n setup-omniagent-db-dev.sh
          for script in infra/gcp/*.sh; do bash -n "$script"; done
          docker run -d --name omniagent-ghcr-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=omniagent_test -e POSTGRES_PASSWORD=isolated_ci_only \
            -e POSTGRES_DB=omniagent_acceptance postgres:16-alpine
          trap 'docker rm -f omniagent-ghcr-pg >/dev/null 2>&1 || :' EXIT
          for attempt in $(seq 1 35); do
            if docker exec omniagent-ghcr-pg pg_isready -U omniagent_test -d omniagent_acceptance >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PG_TEST_URL=postgres://omniagent_test:isolated_ci_only@127.0.0.1:5432/omniagent_acceptance \
            npx vitest run tests/chat_storage.acceptance.test.ts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter tests and build
        working-directory: apps/agent_app
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test
          flutter build web
      - name: Static check against publishing secrets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in ("services/chat-api/Dockerfile","services/agent-gateway/Dockerfile",
                       "services/shared-codex/Dockerfile"):
              for line in Path(name).read_text().splitlines():
                  parts=line.strip().split()
                  if parts and parts[0].upper() in ("COPY","ADD") and parts[1:2] in (["."],["./"]):
                      raise SystemExit("broad Docker COPY/ADD denied")
          paths=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          for path in paths:
              name=Path(path).name
              if name in (".env","credentials.json","service-account.json") or name.startswith(".env."):
                  raise SystemExit("credential file tracked")
          print("public_image_source_scope=PASS")
          PY

  publish:
    needs: quality
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: chat, image: omniagent-chat, dockerfile: services/chat-api/Dockerfile }
          - { component: gateway, image: omniagent-agent-gateway, dockerfile: services/agent-gateway/Dockerfile }
          - { component: shared, image: omniagent-shared-codex, dockerfile: services/shared-codex/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          main="$(git ls-remote https://github.com/tommylin15/omniAgent.git refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" = "$main"
      - uses: google-github-actions/auth@v2
        if: matrix.component == 'chat'
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: matrix.component == 'chat'
      - name: Read existing public Google OAuth client ID
        if: matrix.component == 'chat'
        id: client
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe omniagent-chat --project=gen-lang-client-0593591102 \
            --region=us-central1 --format=json > "$RUNNER_TEMP/chat.json"
          python3 - "$RUNNER_TEMP/chat.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          env=obj["spec"]["template"]["spec"]["containers"][0].get("env",[])
          rows=[e.get("value") for e in env if e.get("name")=="OMNIAGENT_GOOGLE_CLIENT_ID"]
          if len(rows)!=1 or not isinstance(rows[0],str) or not rows[0].endswith(".apps.googleusercontent.com"):
              raise SystemExit("public_google_oauth_client_id_missing")
          with open(sys.argv[2],"a") as out:
              out.write("id="+rows[0]+"\n")
          print("oauth_client_id=CONFIGURED")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ghcr.io/tommylin15/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tommylin15/omniAgent
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMNIAGENT_GOOGLE_CLIENT_ID=${{ steps.client.outputs.id }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Immutable GHCR receipt
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ghcr_image_digest=PASS"
          {
            echo "### ${{ matrix.image }}"
            echo "Image: ghcr.io/tommylin15/${{ matrix.image }}@${DIGEST}"
            echo "Initial GHCR package visibility may be Private. Set Public before Cloud Run deployment."
            echo "No Google Cloud Storage or Artifact Registry writes and no Cloud Run traffic changes."
          } >> "$GITHUB_STEP_SUMMARY"
