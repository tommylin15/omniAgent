name: omniAgent P0 verified Owner identity preflight
on:
  push:
    branches: [main]
    paths:
      - 'infra/gcp/p0-owner-identity-preflight.sh'
      - '.github/workflows/omniagent-p0-owner-identity-preflight.yml'
permissions:
  contents: read
  id-token: write
jobs:
  verify-owner-without-secret-access:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate OAuth Owner DB mapping and shared auth metadata only
        shell: bash
        run: |
          set -euo pipefail
          bash infra/gcp/p0-owner-identity-preflight.sh | tee "$RUNNER_TEMP/p0-owner-identity.txt"
          grep -qx 'owner_identity=PASS_DB_BACKED_OAUTH_OWNER' "$RUNNER_TEMP/p0-owner-identity.txt"
          cat "$RUNNER_TEMP/p0-owner-identity.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omniagent-owner-identity-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/p0-owner-identity.txt
          if-no-files-found: warn
          retention-days: 30
