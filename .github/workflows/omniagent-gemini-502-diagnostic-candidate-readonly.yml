# Zero inference / zero deployment, immutable Chat/Gateway diagnostic handoff.
name: omniAgent Gemini CEO 502 candidate config readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omniagent-gemini-502-diagnostic-candidate-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  readback:
    if: github.repository == 'tommylin15/omniAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      SERVICE: omniagent-agent-gateway
      SOURCE_SHA: bf6b3851ccea4316a2d07963d594921554340351
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/omniagent-github/providers/github
          service_account: omniagent-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check unchanged private routing and expected immutable diagnostic candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/svc.json"
          gcloud run services get-iam-policy "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          python3 - "$RUNNER_TEMP/svc.json" "$RUNNER_TEMP/iam.json" "$GITHUB_ENV" <<'PY'
          import json,os,re,sys
          svc=json.load(open(sys.argv[1]));iam=json.load(open(sys.argv[2]))
          routes=(svc.get("status") or {}).get("traffic") or []
          serving=[x for x in routes if x.get("percent",0)>0]
          tag="ghcr-"+os.environ["SOURCE_SHA"][:12]
          candidate=[x for x in routes if x.get("tag")==tag and x.get("percent",0)==0]
          if len(serving)!=1 or serving[0].get("percent")!=100 or len(candidate)!=1:
              raise SystemExit("BLOCKED: serving or diagnostic tag changed")
          canonical=(svc.get("status") or {}).get("url","").rstrip("/")
          tagged=candidate[0].get("url","").rstrip("/")
          if not re.fullmatch(r"https://omniagent-agent-gateway-[a-z0-9-]+\.a\.run\.app",canonical):
              raise SystemExit("BLOCKED: canonical audience changed")
          if not tagged.startswith("https://"+tag+"---omniagent-agent-gateway-") or not tagged.endswith(".a.run.app"):
              raise SystemExit("BLOCKED: zero-traffic URL unexpected")
          members={m for b in iam.get("bindings") or [] if b.get("role")=="roles/run.invoker"
                   for m in b.get("members") or []}
          if any(m in members for m in ("allUsers","allAuthenticatedUsers")):
              raise SystemExit("BLOCKED: Gateway public IAM")
          caller={key:"serviceAccount:omniagent-codex-"+suffix+"@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
              for key,suffix in (("omniagent","chat-client"),("market-mart","market-client"),("life-assistant","life-client"))}
          if any(m not in members for m in caller.values()):
              raise SystemExit("BLOCKED: dedicated invoker missing")
          with open(sys.argv[3],"a") as f:
              f.write("DIAG_REV="+candidate[0]["revisionName"]+"\n")
              f.write("DIAG_URL="+tagged+"\n")
              f.write("DIAG_AUDIENCE="+canonical+"\n")
          print("diagnostic_candidate_traffic=PASS_ZERO_PERCENT")
          print("unchanged_formal_gateway_traffic=ONE_REVISION_100_PERCENT")
          print("caller_iam=PASS_PRIVATE_AND_THREE_EXACT_SCOPES")
          print("diagnostic_candidate_url="+tagged+"/v1/gemini/execute")
          print("diagnostic_token_audience="+canonical)
          PY
      - name: Verify current diagnostic candidate Ready, release digest and runtime feature
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run revisions describe "$DIAG_REV" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/rev.json"
          python3 - "$RUNNER_TEMP/svc.json" "$RUNNER_TEMP/rev.json" <<'PY'
          import json,os,re,sys
          svc,rev=(json.load(open(x)) for x in sys.argv[1:3])
          conditions=(rev.get("status") or {}).get("conditions") or []
          if not any(x.get("type")=="Ready" and x.get("status")=="True" for x in conditions):
              raise SystemExit("BLOCKED: diagnostic Gateway Revision unready")
          original=(((svc.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers") or []
          container=(rev.get("spec") or {}).get("containers") or []
          if len(original)!=1 or len(container)!=1:
              raise SystemExit("BLOCKED: unexpected Gateway containers")
          source=original[0].get("image","")
          image=container[0].get("image","").removeprefix("cache.us-docker.pkg.dev/")
          if not re.fullmatch(r"ghcr\.io/tommylin15/omniagent-agent-gateway@sha256:[a-f0-9]{64}",source) or image!=source:
              raise SystemExit("BLOCKED: candidate immutable digest mismatch")
          env={x.get("name"):x for x in container[0].get("env") or []}
          if env.get("GEMINI_SHARED_EXECUTION_ENABLED",{}).get("value")!="true":
              raise SystemExit("BLOCKED: Gateway private Gemini route disabled")
          if env.get("GEMINI_SHARED_AUDIENCE",{}).get("value","").rstrip("/")!=os.environ["DIAG_AUDIENCE"]:
              raise SystemExit("BLOCKED: signed audience mismatch")
          if env.get("GEMINI_SHARED_MODEL",{}).get("value")!="gemini-3.5-flash-lite" or env.get("GEMINI_PAID_ENABLED",{}).get("value")=="true":
              raise SystemExit("BLOCKED: approved model/billing guard drift")
          if not env.get("OMNIAGENT_PROVIDER_BUNDLE",{}).get("valueFrom"):
              raise SystemExit("BLOCKED: provider Secret reference missing")
          expected={key:"omniagent-codex-"+suffix+"@"+os.environ["PROJECT"]+".iam.gserviceaccount.com"
              for key,suffix in (("omniagent","chat-client"),("market-mart","market-client"),("life-assistant","life-client"))}
          try:caller=json.loads(env["GEMINI_SHARED_CALLERS_JSON"]["value"])
          except (ValueError,TypeError,KeyError):raise SystemExit("BLOCKED: Gateway caller map missing")
          if caller!=expected:
              raise SystemExit("BLOCKED: Gateway caller map changed")
          print("immutable_gateway_image=PASS")
          print("diagnostic_candidate_ready=PASS")
          print("shared_gemini_route=PASS_ENABLED_PRIVATE")
          print("model_and_provider_secret=PASS")
          print("provider_calls_from_this_workflow=ZERO")
          print("diagnostic_failure_categories_source_sha="+os.environ["SOURCE_SHA"][:12])
          PY
      - name: Confirm serving tag and 0-percent candidate unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/svc.json" || { echo "final_readback=NO_BASELINE"; exit 0; }
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/final.json"
          python3 - "$RUNNER_TEMP/svc.json" "$RUNNER_TEMP/final.json" <<'PY'
          import json,os,sys
          old,new=(json.load(open(f)) for f in sys.argv[1:3])
          routes=lambda d:(d.get("status") or {}).get("traffic") or []
          formal=lambda d:{x.get("revisionName"):x.get("percent") for x in routes(d) if x.get("percent",0)>0}
          tag="ghcr-"+os.environ["SOURCE_SHA"][:12]
          if formal(old)!=formal(new) or not any(x.get("tag")==tag and x.get("percent",0)==0 for x in routes(new)):
              raise SystemExit("BLOCKED: formal traffic or diagnostic candidate changed")
          print("formal_traffic_unchanged=PASS")
          print("zero_traffic_diagnostic_candidate_retained=PASS")
          PY
