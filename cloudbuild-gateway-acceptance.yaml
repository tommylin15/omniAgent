substitutions:
  _SERVICE_URL: ""
  _TOKEN_SERVICE_ACCOUNT: ""

steps:
  - id: real-provider-dispatch
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_SERVICE_URL}"
        test -n "${_TOKEN_SERVICE_ACCOUNT}"
        gcloud secrets versions access 1 --secret=omniagent-internal-signing-key --project="${PROJECT_ID}" --out-file=/tmp/signing-key
        token="$(gcloud auth print-identity-token --impersonate-service-account="${_TOKEN_SERVICE_ACCOUNT}" --audiences="${_SERVICE_URL}" --include-email)"
        sign() {
          local body="$1" output="$2" timestamp signature
          timestamp="$(date +%s%3N)"
          signature="$(KEY_FILE=/tmp/signing-key TIMESTAMP="${timestamp}" BODY="${body}" python3 -c 'import hashlib,hmac,os; print(hmac.new(open(os.environ["KEY_FILE"],"rb").read(),(os.environ["TIMESTAMP"]+"."+os.environ["BODY"]).encode(),hashlib.sha256).hexdigest())')"
          curl --silent --show-error --max-time 300 -o "${output}" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            -H "X-Janus-Timestamp: ${timestamp}" -H "X-Janus-Signature: v1=${signature}" \
            --data "${body}" "${_SERVICE_URL}/internal/v1/assistant/turn"
        }
        for runtime in openrouter gemini; do
          if [[ "${runtime}" == openrouter ]]; then model=openrouter/free; else model=gemini-2.5-flash; fi
          body="{\"ownerId\":\"00000000-0000-0000-0000-000000000001\",\"threadId\":\"real-provider-probe-${runtime}\",\"turnId\":\"turn-1\",\"runtime\":\"${runtime}\",\"model\":\"${model}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word ok.\"}],\"continuation\":{}}"
          status="$(sign "${body}" "/tmp/${runtime}.json")"
          [[ "${status}" == 200 ]] || { echo "${runtime} status=${status}"; exit 22; }
          RUNTIME="${runtime}" RESULT_FILE="/tmp/${runtime}.json" python3 -c 'import json,os; v=json.load(open(os.environ["RESULT_FILE"])); e=v["events"]; assert e and v["continuation"]["runtime"]==os.environ["RUNTIME"]; assert any(x["type"]=="turn_completed" for x in e); assert any(x["type"]=="text_delta" and x["payload"].get("text") for x in e); assert "api_key" not in json.dumps(e).lower(); print(os.environ["RUNTIME"],"real dispatch passed; events=",len(e))'
        done

options:
  logging: CLOUD_LOGGING_ONLY
